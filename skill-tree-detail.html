code:`// 相机选型计算公式（C#实现）
public class CameraSelector {
    // 根据检测需求计算所需相机参数
    public CameraSpec Select(double fovMm, double accuracyMm, double cycleTimeSec) {
        // 所需像素数
        int minPixels = (int)Math.Ceiling(fovMm / accuracyMm);
        // 所需分辨率
        double resolution = fovMm / minPixels; // mm/pixel

        // 选择标准分辨率
        var stdRes = new[] {
            (640, 480), (1280, 1024), (1600, 1200),
            (2048, 1536), (2592, 1944), (5120, 3840)
        };

        var selected = stdRes.First(r => r.Item1 >= minPixels && r.Item2 >= minPixels);

        // 所需帧率
        double fps = 1.0 / cycleTimeSec;

        return new CameraSpec {
            Resolution = $"{selected.Item1}x{selected.Item2}",
            Pixels = selected,
            FrameRate = fps,
            Accuracy = resolution,
            Interface = cycleTimeSec < 0.1 ? "USB3 or CameraLink" : "GigE"
        };
    }
}`,

code:`// PLC握手时序伪代码（最常用的触发-检测-回写流程）
public class PlcHandshake {
    private SiemensS7Net plc;
    private const string TRIGGER_ADDR = "M100.0";  // PLC写1触发检测
    private const string RESULT_ADDR = "M200.0";   // 视觉写1=OK 0=NG
    private const string READY_ADDR  = "M100.1";   // 视觉写1表示就绪
    private const string HEARTBEAT   = "M99.0";   // 心跳翻转

    public DetectionResult WaitForTrigger() {
        // 1. 告诉PLC视觉已就绪
        plc.Write(READY_ADDR, 1);

        // 2. 轮询等待触发信号
        while (plc.ReadBool(TRIGGER_ADDR) == false) {
            Thread.Sleep(5);
        }

        // 3. 执行检测
        var result = ExecuteDetection();

        // 4. 回写结果
        plc.Write(RESULT_ADDR, result.IsOk ? (byte)1 : (byte)0);

        // 5. 复位触发信号
        plc.Write(TRIGGER_ADDR, 0);

        // 6. 清除就绪信号（表示正在处理）
        plc.Write(READY_ADDR, 0);

        return result;
    }

    // 心跳线程：每秒翻转一次
    public void HeartbeatLoop() {
        bool toggle = false;
        while (running) {
            plc.Write(HEARTBEAT, toggle ? (byte)1 : (byte)0);
            toggle = !toggle;
            Thread.Sleep(1000);
        }
    }
}`,

code:`// HDevelop导出的C#代码集成到WPF项目
// 1. 添加引用：halcondotnet.dll
using HalconDotNet;

public class HalconDetector {
    public DetectionResult Detect(string imagePath) {
        HObject image, grayRegion, connectedRegions, selectedRegions;
        HTuple area, row, col;

        // 初始化局部变量
        HOperatorSet.GenEmptyObj(out image);
        HOperatorSet.GenEmptyObj(out grayRegion);
        HOperatorSet.GenEmptyObj(out connectedRegions);
        HOperatorSet.GenEmptyObj(out selectedRegions);

        // 1. 读取图像
        image = new HObject();
        HOperatorSet.ReadImage(out image, imagePath);

        // 2. 灰度化（如果是彩色图）
        HObject grayImage;
        HOperatorSet.Rgb1ToGray(image, out grayImage);

        // 3. 阈值分割
        grayRegion = new HObject();
        HOperatorSet.Threshold(grayImage, out grayRegion, 100, 255);

        // 4. 连通域分析
        connectedRegions = new HObject();
        HOperatorSet.Connection(grayRegion, out connectedRegions);

        // 5. 特征筛选
        selectedRegions = new HObject();
        HOperatorSet.SelectShape(connectedRegions, out selectedRegions,
            "area", "and", 500, 50000);

        // 6. 获取结果
        HOperatorSet.AreaCenter(selectedRegions, out area, out row, out col);

        // 7. 释放资源（关键！）
        image.Dispose();
        grayImage.Dispose();
        grayRegion.Dispose();
        connectedRegions.Dispose();
        selectedRegions.Dispose();

        return new DetectionResult {
            IsOk = area.Length > 0,
            Area = area.Length > 0 ? area[0].D : 0
        };
    }
}`,
codeLang:"csharp",
pitfalls:[
"<b>不释放HObject：</b>Halcon对象是C++底层的非托管资源，GC不会自动回收。每次检测都创建但不Dispose，几小时后内存溢出",
"<b>HTuple类型混淆：</b>HTuple返回的数值用.D取double、.I取int、.S取string，用错类型会抛异常或返回0",
"<b>导出代码直接用：</b>HDevelop导出的C#代码没有错误处理和资源释放，必须手动包try-finally加Dispose"
],
scenario:"新项目需要检测螺丝是否安装到位。你在HDevelop中快速验证算法：读取图像→灰度化→阈值分割(螺丝白色)→连通域→按面积筛选(螺丝面积范围)→判断有无。验证通过后导出C#代码，在VS中创建HalconDetector类，给每个HObject加try-finally Dispose，封装成Detect(imagePath)方法供WPF界面调用。这就是从算法验证到代码集成的标准流程，每个新项目都重复这个流程。"
}},

code:`* Halcon形状模板匹配完整流程

* ===== 1. 创建模板（一次性，离线执行） =====
read_image (Image, 'product/reference.png')
* 框选模板区域
draw_rectangle1 (WindowHandle, Row1, Col1, Row2, Col2)
gen_rectangle1 (ModelROI, Row1, Col1, Row2, Col2)
reduce_domain (Image, ModelROI, ModelImage)

* 创建形状模板
create_shape_model (ModelImage, 'auto', rad(-10), rad(20), 'auto', \
    'auto', 'use_polarity', 'auto', 'auto', ModelID)

* 保存模板（生产环境加载用）
write_shape_model (ModelID, 'product_model.shm')

* ===== 2. 在线匹配（每次检测执行） =====
read_image (TestImage, 'product/test.png')

* 查找模板
find_shape_model (TestImage, ModelID, rad(-10), rad(30), 0.5, \
    1, 0.5, 'least_squares', 0, 0.9, Row, Column, Angle, Score)

* 判断是否找到
if (|Score| > 0)
    * 生成定位后的ROI
    vector_angle_to_rigid (0, 0, 0, Row, Column, Angle, HomMat2D)
    affine_trans_region (ModelROI, TransformedROI, HomMat2D, 'false')
    reduce_domain (TestImage, TransformedROI, DetectionImage)

    * 在裁剪后的区域上执行后续检测
    threshold (DetectionImage, DefectRegion, 0, 80)
    connection (DefectRegion, DefectRegions)
    select_shape (DefectRegions, RealDefects, 'area', 'and', 50, 99999)

    * 结果判断
    count_obj (RealDefects, NumDefects)
    if (NumDefects > 0)
        Result := 'NG'
    else
        Result := 'OK'
    endif
else
    Result := 'NOT_FOUND'
endif`,

code:`* Blob分析完整流程 + 动态阈值对比

* ===== 方法1: 固定阈值（光照均匀时用） =====
read_image (Image, 'parts/image1.png')
rgb1_to_gray (Image, GrayImage)
threshold (GrayImage, Region, 100, 255)
connection (Region, ConnectedRegions)

* 多特征联合筛选（关键技巧）
select_shape (ConnectedRegions, Selected, ['area','width','height','circularity'], \
    'and', [500, 20, 20, 0.3], [50000, 200, 200, 1.0])

* 获取结果
area_center (Selected, Area, Row, Column)
count_obj (Selected, NumParts)

* ===== 方法2: 动态阈值（光照不均时用） =====
* 局部均值滤波（窗口大小=目标尺寸的2倍）
mean_image (GrayImage, MeanImage, 15, 15)

* 动态阈值：原图比均值暗/亮一定范围的部分
dyn_threshold (GrayImage, MeanImage, RegionDyn, 5, 'dark')

connection (RegionDyn, ConnectedRegionsDyn)
select_shape (ConnectedRegionsDyn, SelectedDyn, 'area', 'and', 100, 5000)

* ===== 方法3: 自动阈值（直方图自动分割） =====
auto_threshold (GrayImage, AutoRegions, 2.0)
* 2.0是平滑因子，越大越容易合并相邻峰`,

code:`* Halcon OCR完整流程

* ===== 1. 训练阶段（离线一次性） =====
* 读取标注好的训练图像
read_image (TrainImage, 'ocr/train.png')

* 分割字符区域
threshold (TrainImage, CharRegion, 128, 255)
connection (CharRegion, CharRegions)
sort_region (CharRegions, SortedChars, 'character', 'true', 'column')

* 标注字符（人工或半自动）
* 将每个字符区域与对应标签存入训练文件
write_string (TrainFile, 'characters.trf')
append_characters_to_database (SortedChars, TrainImage, \
    ['A','B','C','0','1','2'], TrainFile)

* 创建并训练 MLP 分类器
create_ocr_class_mlp ('0-9A-Z', 5, 5, 'none', 'normalization', 10, 42, OCRHandle)
trainf_ocr_class_mlp (OCRHandle, TrainFile, 200, 1, 0.01, Error, ErrorLog)

* 保存模型
write_ocr_class_mlp (OCRHandle, 'ocr_model.omc')

* ===== 2. 在线识别阶段 =====
read_image (TestImage, 'ocr/test.png')

* 预处理：增强对比度
emphasize (TestImage, EnhancedImage, 7, 7, 1.5)

* 分割字符区域
threshold (EnhancedImage, CharRegion, 100, 255)
connection (CharRegion, Chars)
sort_region (Chars, SortedChars, 'character', 'true', 'column')

* 识别
do_ocr_multi_class_mlp (SortedChars, EnhancedImage, OCRHandle, Class, Confidence)

* 拼接识别结果
ResultString := sum(Class)

* ===== C# 集成 =====
public class OcrReader {
    private HTuple ocrHandle;

    public void Init() {
        HOperatorSet.ReadOcrClassMlp("ocr_model.omc", out ocrHandle);
    }

    public string Read(HObject image) {
        HObject charRegion, chars, sorted;
        HTuple classResult, confidence;

        HOperatorSet.Threshold(image, out charRegion, 100, 255);
        HOperatorSet.Connection(charRegion, out chars);
        HOperatorSet.SortRegion(chars, out sorted,
            "character", "true", "column");
        HOperatorSet.DoOcrMultiClassMlp(sorted, image,
            ocrHandle, out classResult, out confidence);

        // 拼接所有字符
        string result = "";
        for (int i = 0; i < classResult.Length; i++)
            result += classResult[i].S;

        charRegion.Dispose(); chars.Dispose(); sorted.Dispose();
        return result;
    }
}`,

code:`* 图像预处理与滤波增强

* ===== 1. 空间域滤波 =====

* 高斯噪声 → 高斯滤波
gauss_filter (Gray, GaussImage, 5)

* 保留边缘去噪 → 双边滤波
bilateralfilter (Gray, Gray, BilateralImage, 3, 10, [], 0)

* 对比度增强
emphasize (Gray, EnhancedImage, 7, 7, 1.5)
scale_image (EnhancedImage, ScaledImage, 3.0, -300)

* ===== 2. 形态学处理 =====
* 去除小噪声点
opening_circle (BinaryRegion, CleanRegion, 1.5)
* 填充小孔洞
closing_circle (CleanRegion, FilledRegion, 3.5)
* 平滑边界
smooth_region (FilledRegion, SmoothRegion, 5)

* ===== 3. 频域滤波（处理周期性噪声） =====
* 如显示器条纹噪声、莫尔条纹
read_image (NoisyImage, 'defect/moire.png')
rgb1_to_gray (NoisyImage, GrayImage)

* FFT 变换
fft_image (GrayImage, FFTImage)

* 创建带通滤波器（去掉低频背景和高频噪声）
gen_bandpass (BandpassFilter, 0.1, 0.3, 'n', 'dc', 512, 512)

* 频域卷积
convolve_fft (FFTImage, BandpassFilter, FilteredFFT)

* 逆变换回空间域
ifft_image (FilteredFFT, ResultImage)

* ===== 预处理选择决策树 =====
* 噪声类型？→ 椒盐: median / 高斯: gauss / 混合: bilateral
* 要保留边缘？→ bilateral
* 周期性噪声？→ 频域滤波
* 对比度不够？→ emphasize + scale_image`,

code:`// 海康MVS SDK + Halcon GenImage1 集成
using MvCamCtrl.NET;
using HalconDotNet;
using System.Runtime.InteropServices;

public class HikCamera {
    private MyCamera camera = new MyCamera();
    private MyCamera.cbOutputEx imageCallback;
    private CancellationTokenSource cts;
    private Thread grabThread;

    // 初始化相机
    public bool Connect(string ip) {
        // 枚举设备
        MyCamera.MV_CC_DEVICE_INFO_LIST deviceList;
        MyCamera.MV_CC_EnumDevices_NET(MyCamera.MV_GIGE_DEVICE | MyCamera.MV_USB_DEVICE,
            out deviceList);

        // 通过IP找到目标设备
        int targetIdx = -1;
        for (int i = 0; i < deviceList.nDeviceNum; i++) {
            var info = (MyCamera.MV_GIGE_DEVICE_INFO)Marshal.PtrToStructure(
                deviceList.pDeviceInfo[i], typeof(MyCamera.MV_GIGE_DEVICE_INFO));
            if (info.nCurrentIp.ToString() == ip) { targetIdx = i; break; }
        }
        if (targetIdx < 0) return false;

        // 创建并打开
        camera.MV_CC_CreateDevice_NET(ref deviceList.pDeviceInfo[targetIdx]);
        camera.MV_CC_OpenDevice_NET();

        // 设置参数
        camera.MV_CC_SetFloatValue_NET("ExposureTime", 5000f);
        camera.MV_CC_SetEnumValue_NET("TriggerMode", 0); // 0=连续

        return true;
    }

    // 连续采集线程
    public void StartGrab(Action<HObject> onImageReady) {
        cts = new CancellationTokenSource();
        camera.MV_CC_StartGrabbing_NET();

        grabThread = new Thread(() => {
            while (!cts.Token.IsCancellationRequested) {
                MyCamera.MV_FRAME_OUT outFrame = new MyCamera.MV_FRAME_OUT();
                int ret = camera.MV_CC_GetImageBuffer_NET(ref outFrame, 1000);
                if (ret == MyCamera.MV_OK) {
                    // ★ 关键：GenImage1 零拷贝转换
                    HObject hImage;
                    int w = outFrame.stFrameInfo.nWidth;
                    int h = outFrame.stFrameInfo.nHeight;
                    IntPtr dataPtr = outFrame.pBuf;
                    // 获取每行字节数
                    int stride = w; // Mono8格式下stride=width

                    HOperatorSet.GenImage1(out hImage, "byte", w, h,
                        dataPtr);
                    onImageReady?.Invoke(hImage);
                    camera.MV_CC_FreeImageBuffer_NET(ref outFrame);
                }
            }
        });
        grabThread.IsBackground = true;
        grabThread.Start();
    }

    public void Stop() {
        cts?.Cancel();
        camera.MV_CC_StopGrabbing_NET();
        camera.MV_CC_CloseDevice_NET();
        camera.MV_CC_DestroyDevice_NET();
    }
}`,

code:`// 光源控制器编程接口（通用伪代码）
public class LightController {
    private SerialPort port;

    // 光源类型与典型应用对照
    public static readonly Dictionary<string, string> LightGuide = new() {
        {"背光源", "尺寸测量、轮廓检测、边缘定位"},
        {"环形光明场", "表面印刷、条码识别、有无检测"},
        {"同轴光", "平整反光面、金属表面、薄膜检测"},
        {"低角度暗场", "划痕、雕刻码、表面微缺陷"},
        {"圆顶无影光", "球面/曲面、反光不规则表面"},
        {"条形光", "线扫相机、大视场、边缘检测"}
    };

    // 通道控制（多光源组合）
    public void SetChannel(int channel, int brightness) {
        // 通道1: 环形光(看表面)  通道2: 同轴光(看反光)
        // 通道3: 背光(看轮廓)
        string cmd = $"SET CH{channel} {brightness}\\r\\n";
        port.Write(cmd);
    }

    // 频闪触发（与相机同步）
    public void StrobeTrigger(int channel, int durationUs) {
        // 相机触发信号 → 光源频闪 → 曝光结束 → 光源关闭
        string cmd = $"STROBE CH{channel} {durationUs}\\r\\n";
        port.Write(cmd);
    }

code:`// HslCommunication 西门子S7完整封装
using HslCommunication.Profinet.Siemens;
using HslCommunication;

public class SiemensPlcService {
    private SiemensS7Net plc;
    private Timer heartbeatTimer;
    private Timer reconnectTimer;
    private bool isConnected = false;
    private bool heartbeatToggle = false;

    // PLC地址定义
    public const string TRIGGER = "M100.0";   // 触发信号
    public const string READY   = "M100.1";   // 视觉就绪
    public const string RESULT  = "M200.0";   // 检测结果 OK=1/NG=0
    public const string HEARTBEAT = "M99.0";  // 心跳
    public const string OK_COUNT = "MW200";   // OK计数
    public const string NG_COUNT = "MW202";   // NG计数

    public bool Connect(string ip) {
        plc = new SiemensS7Net(SiemensPLCS.S1200, ip);
        var result = plc.Connect();
        if (result.IsSuccess) {
            isConnected = true;
            StartHeartbeat();
            StartReconnectMonitor();
            return true;
        }
        return false;
    }

    // 心跳：每秒翻转M99.0
    private void StartHeartbeat() {
        heartbeatTimer = new Timer(_ => {
            try {
                heartbeatToggle = !heartbeatToggle;
                plc.Write(HEARTBEAT, heartbeatToggle);
            } catch {
                isConnected = false;
            }
        }, null, 0, 1000);
    }

    // 重连监测：每3秒检查连接状态
    private void StartReconnectMonitor() {
        reconnectTimer = new Timer(_ => {
            if (!isConnected) {
                try {
                    var result = plc.Connect();
                    if (result.IsSuccess) isConnected = true;
                } catch { }
            }
        }, null, 0, 3000);
    }

    // 完整握手流程
    public DetectionResult WaitForTriggerAndDetect(Func<DetectionResult> detectFunc) {
        // 1. 告诉PLC视觉就绪
        plc.Write(READY, true);

        // 2. 轮询等待触发
        while (true) {
            if (plc.ReadBool(TRIGGER).Content) break;
            Thread.Sleep(5);
        }

        // 3. 执行检测
        var result = detectFunc();

        // 4. 回写结果
        plc.Write(RESULT, result.IsOk);
        // 可选：回写详细数据到DB区
        // plc.Write("DB1.DBW0", (short)result.DefectCount);

        // 5. 复位触发信号（关键！）
        plc.Write(TRIGGER, false);
        plc.Write(READY, false);

        return result;
    }

    public void Disconnect() {
        heartbeatTimer?.Dispose();
        reconnectTimer?.Dispose();
        plc?.ConnectClose();
    }
}`,

scenario:"S7-1200通过以太网连接上位机。你封装了SiemensPlcService类：Connect(ip)建立连接→启动心跳线程(每秒翻转M99.0)→启动重连监测(断线3秒后自动重连)。检测流程：Write(READY,true)→轮询ReadBool(TRIGGER)等待→执行检测→Write(RESULT,ok)→Write(TRIGGER,false)复位。所有PLC读写加lock(plc)防止心跳线程和检测线程冲突。这套封装在每个S7项目中直接复用。"

code:`// MVVM 完整实现（工业上位机标准模式）
using System.ComponentModel;
using System.Runtime.CompilerServices;
using System.Windows.Input;

// 1. ViewModel基类
public abstract class ViewModelBase : INotifyPropertyChanged {
    public event PropertyChangedEventHandler PropertyChanged;
    protected bool SetProperty<T>(ref T field, T value,
        [CallerMemberName] string prop = null) {
        if (Equals(field, value)) return false;
        field = value;
        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(prop));
        return true;
    }
}

// 2. RelayCommand
public class RelayCommand : ICommand {
    private readonly Action _execute;
    private readonly Func<bool> _canExecute;
    public RelayCommand(Action execute, Func<bool> canExecute = null) {
        _execute = execute; _canExecute = canExecute;
    }
    public event EventHandler CanExecuteChanged;
    public bool CanExecute(object parameter) => _canExecute?.Invoke() ?? true;
    public void Execute(object parameter) => _execute();
}

// 3. 检测结果模型
public class DetectionStats : ViewModelBase {
    private int _okCount;
    public int OkCount {
        get => _okCount;
        set => SetProperty(ref _okCount, value);
    }
    private int _ngCount;
    public int NgCount {
        get => _ngCount;
        set { SetProperty(ref _ngCount, value); OnPropertyChanged(nameof(Yield)); }
    }
    public double Yield => TotalCount > 0
        ? Math.Round((double)OkCount / TotalCount * 100, 1) : 0;
    public int TotalCount => OkCount + NgCount;
    public string YieldColor => Yield >= 95 ? "Green" : Yield >= 85 ? "Orange" : "Red";
}

// 4. 主ViewModel
public class MainViewModel : ViewModelBase {
    private DetectionStats _stats = new DetectionStats();
    public DetectionStats Stats {
        get => _stats;
        set => SetProperty(ref _stats, value);
    }
    private string _statusText = "就绪";
    public string StatusText {
        get => _statusText;
        set => SetProperty(ref _statusText, value);
    }
    private bool _isRunning;
    public bool IsRunning {
        get => _isRunning;
        set { SetProperty(ref _isRunning, value);
              StartCommand?.RaiseCanExecuteChanged(); }
    }
    public ICommand StartCommand { get; }
    public ICommand StopCommand { get; }

    private VisionEngine engine;

    public MainViewModel() {
        StartCommand = new RelayCommand(StartDetection, () => !IsRunning);
        StopCommand = new RelayCommand(StopDetection, () => IsRunning);
    }

    private void StartDetection() {
        IsRunning = true;
        StatusText = "检测中...";
        Task.Run(() => {
            while (IsRunning) {
                var result = engine.Execute();

                // ★ 关键：后台线程更新UI用Dispatcher
                Application.Current.Dispatcher.Invoke(() => {
                    if (result.IsOk) Stats.OkCount++;
                    else Stats.NgCount++;
                });
            }
        });
    }
    private void StopDetection() {
        IsRunning = false;
        StatusText = "已停止";
    }
}

<!-- XAML绑定 -->
<Window.DataContext>
    <local:MainViewModel/>
</Window.DataContext>
<StackPanel>
    <TextBlock Text="{Binding Stats.OkCount, StringFormat=OK: {0}}"/>
    <TextBlock Text="{Binding Stats.NgCount, StringFormat=NG: {0}}"/>
    <TextBlock Text="{Binding Stats.Yield, StringFormat=良率: {0}%}"/>
    <Button Content="开始" Command="{Binding StartCommand}"/>
    <Button Content="停止" Command="{Binding StopCommand}"/>
    <TextBlock Text="{Binding StatusText}"/>
</StackPanel>`,

"用BlockingCollection做生产者-消费者队列：采集线程用Add(image)入队，检测线程用Take()阻塞出队，BoundedCapacity限制内存",

code:`// 视觉系统三线程解耦架构（生产级实现）
using System.Collections.Concurrent;
using System.Threading;

public class VisionSystem {
    // 线程间队列（有界队列防止内存溢出）
    private BlockingCollection<HObject> imageQueue;
    private BlockingCollection<DetectionResult> resultQueue;

    private CancellationTokenSource cts;
    private Thread grabThread, processThread, displayThread;

    // Halcon对象池（避免频繁创建销毁）
    private ConcurrentBag<HObject> imagePool = new();

    public void Start() {
        cts = new CancellationTokenSource();
        imageQueue = new BlockingCollection<HObject>(3);   // 最多缓存3帧
        resultQueue = new BlockingCollection<DetectionResult>(100);

        // 线程1: 相机采集
        grabThread = new Thread(() => {
            while (!cts.Token.IsCancellationRequested) {
                try {
                    var image = camera.Grab();  // 阻塞等待相机
                    imageQueue.Add(image, cts.Token);
                } catch (OperationCanceledException) {
                    break;
                } catch (Exception ex) {
                    logger.Error("采集异常", ex);
                    Thread.Sleep(100); // 异常后短暂等待
                }
            }
        }) { IsBackground = true, Name = "GrabThread" };

        // 线程2: 算法检测
        processThread = new Thread(() => {
            while (!cts.Token.IsCancellationRequested) {
                try {
                    // Take会阻塞直到有数据或被取消
                    var image = imageQueue.Take(cts.Token);
                    var result = halconDetector.Detect(image);
                    image.Dispose(); // 用完即释放
                    resultQueue.Add(result, cts.Token);
                } catch (OperationCanceledException) {
                    break;
                } catch (Exception ex) {
                    logger.Error("检测异常", ex);
                }
            }
        }) { IsBackground = true, Name = "ProcessThread" };

        // 线程3: 结果显示（实际用Dispatcher切换到UI线程）
        displayThread = new Thread(() => {
            while (!cts.Token.IsCancellationRequested) {
                try {
                    var result = resultQueue.Take(cts.Token);
                    // 切换到UI线程更新界面
                    Application.Current?.Dispatcher.Invoke(() => {
                        UpdateUI(result);
                    });
                } catch (OperationCanceledException) {
                    break;
                }
            }
        }) { IsBackground = true, Name = "DisplayThread" };

        grabThread.Start();
        processThread.Start();
        displayThread.Start();
    }

    public void Stop() {
        cts?.Cancel();           // 通知所有线程停止
        imageQueue?.CompleteAdding();  // 告诉队列不再添加数据
        resultQueue?.CompleteAdding();
        // 等待线程退出（超时5秒）
        grabThread?.Join(5000);
        processThread?.Join(5000);
        displayThread?.Join(5000);
        imageQueue?.Dispose();
        resultQueue?.Dispose();
    }

    // 线程安全的PLC访问（用lock）
    private readonly object plcLock = new object();
    public void WriteResultToPlc(DetectionResult result) {
        lock (plcLock) {  // 防止心跳线程和检测线程同时访问PLC
            plc.Write("M200.0", result.IsOk);
        }
    }
}`,

* ===== 3. 在线使用：像素坐标 → 机械坐标 =====

* 误差 = sqrt((CalcX - ActualX)^2 + (CalcY - ActualY)^2)

* Error 应 < 0.1mm

* ===== C# 集成 =====
public class CalibrationService {
    private HTuple homMat2D;

    public void Load(string path) {
        HOperatorSet.ReadTuple(path, out homMat2D);
    }

    public (double x, double y) PixelToWorld(double pixelRow, double pixelCol) {
        HTuple worldX, worldY;
        HOperatorSet.AffineTransPixel(homMat2D,
            pixelRow, pixelCol, out worldX, out worldY);
        return (worldX.D, worldY.D);
    }

    public (double row, double col) WorldToPixel(double worldX, double worldY) {
        HTuple pixelRow, pixelCol;
        HOperatorSet.AffineTransPoint2d(
            homMat2D, worldX, worldY, out pixelRow, out pixelCol);
        return (pixelRow.D, pixelCol.D);
    }
}`,

code:`// ONNX Runtime 深度学习推理集成
using Microsoft.ML.OnnxRuntime;
using Microsoft.ML.OnnxRuntime.Tensors;

public class DefectClassifier {
    private InferenceSession session;

    public void Init(string modelPath) {
        // 加载ONNX模型（支持GPU加速）
        var options = new SessionOptions();
        // options.AppendExecutionProvider_CUDA(0); // GPU加速
        options.AppendExecutionProvider_CPU();

        session = new InferenceSession(modelPath, options);
    }

    public DefectResult Classify(float[] imageData, int width, int height) {
        // 1. 预处理：图像数据转为模型输入格式
        // 假设模型输入: [1, 3, 224, 224] float32, 归一化到0-1
        var inputTensor = new DenseTensor<float>(
            imageData, new[] { 1, 3, height, width });

        // 2. 创建输入
        var inputs = new List<NamedOnnxValue> {
            NamedOnnxValue.CreateFromTensor("input", inputTensor)
        };

        // 3. 推理
        using var results = session.Run(inputs);

        // 4. 后处理：解析输出
        var output = results.First().AsTensor<float>();
        // 假设输出: [1, N] 分类置信度
        // [0]=OK, [1]=划痕, [2]=凹坑, [3]=色差
        int defectClass = 0;
        float maxScore = 0;
        for (int i = 0; i < output.Length; i++) {
            if (output[i] > maxScore) {
                maxScore = output[i];
                defectClass = i;
            }
        }

        return new DefectResult {
            IsOk = defectClass == 0,
            DefectType = defectClass switch {
                0 => "OK",
                1 => "划痕",
                2 => "凹坑",
                3 => "色差",
                _ => "未知"
            },
            Confidence = maxScore
        };
    }
}

// Halcon HImage → float[] 转换

    HOperatorSet.ZoomImageSize(image, out resized,
        targetSize, targetSize, "constant");

    // ... 转换逻辑 ...

    return floatArray;
}`,

code:`// 相机触发模式与双曝光实现
public class CameraTriggerService {
    private MyCamera camera;

    // 配置硬触发模式
    public void ConfigHardwareTrigger() {
        // 开启触发模式
        camera.MV_CC_SetEnumValue_NET("TriggerMode", 1); // 1=On
        // 触发源 = 硬件 Line0
        camera.MV_CC_SetEnumValue_NET("TriggerSource", 0); // 0=Line0
        // 触发沿 = 上升沿
        camera.MV_CC_SetEnumValue_NET("TriggerActivation", 0); // 0=上升沿
        // 触发去抖动 (滤波)
        camera.MV_CC_SetFloatValue_NET("LineDebouncerTime", 100f); // 100us
    }

    // 软触发模式（需要时发指令触发一帧）
    public void ConfigSoftwareTrigger() {
        camera.MV_CC_SetEnumValue_NET("TriggerMode", 1); // On
        camera.MV_CC_SetEnumValue_NET("TriggerSource", 7); // 7=Software
    }

    // 软触发发送
    public void TriggerOnce() {
        camera.MV_CC_SetCommandValue_NET("TriggerSoftware");
    }

    // 双曝光采集（同一位品两次曝光不同参数）
    public (HObject image1, HObject image2) DualExposureGrab() {
        // 第一帧：低曝光 - 看表面缺陷（高亮度区域不过曝）
        camera.MV_CC_SetFloatValue_NET("ExposureTime", 3000f);
        var image1 = WaitForFrame(1000); // 等待触发并取图

        // 第二帧：高曝光 - 读条码/字符（暗区域可读）
        camera.MV_CC_SetFloatValue_NET("ExposureTime", 20000f);
        var image2 = WaitForFrame(1000);

        return (image1, image2);
    }

    // 动态曝光调整（基于图像亮度自动调节）
    public void AutoExposure(HObject image) {
        HTuple mean, deviation;
        HOperatorSet.Intensity(image, image, out mean, out deviation);

        double currentExposure = 5000;
        // 目标灰度均值128
        double targetMean = 128;
        double currentMean = mean.D;

        if (currentMean < targetMean - 10) {
            // 太暗 → 增加曝光
            currentExposure *= (targetMean / Math.Max(currentMean, 1));
            currentExposure = Math.Min(currentExposure, 50000);
        } else if (currentMean > targetMean + 10) {
            // 太亮 → 减少曝光
            currentExposure *= (targetMean / Math.Max(currentMean, 1));
            currentExposure = Math.Max(currentExposure, 100);
        }

        camera.MV_CC_SetFloatValue_NET("ExposureTime", (float)currentExposure);
    }

    private HObject WaitForFrame(int timeoutMs) {
        var sw = System.Diagnostics.Stopwatch.StartNew();
        while (sw.ElapsedMilliseconds < timeoutMs) {
            MyCamera.MV_FRAME_OUT frame = new MyCamera.MV_FRAME_OUT();
            if (camera.MV_CC_GetImageBuffer_NET(ref frame, 100) == 0) {
                HObject img;
                HOperatorSet.GenImage1(out img, "byte",
                    frame.stFrameInfo.nWidth,
                    frame.stFrameInfo.nHeight,
                    frame.pBuf);
                camera.MV_CC_FreeImageBuffer_NET(ref frame);
                return img;
            }
        }
        return null;
    }
}`,

code:`// PLC握手协议完整实现（状态机驱动）
public class PlcHandshakeStateMachine {
    private SiemensS7Net plc;
    private readonly object plcLock = new object();

    // 地址定义表
    static class Addr {
        // 工位1
        public const string TRIGGER_1   = "M100.0";
        public const string READY_1     = "M100.1";
        public const string DETECTING_1 = "M100.2";
        public const string ACK_1       = "M100.3";
        public const string RESULT_1    = "M200.0";
        public const string DEFECT_1    = "MW200";  // 缺陷类型码
        public const string DEFECT_X_1  = "MW202";  // X坐标×100
        public const string DEFECT_Y_1  = "MW204";  // Y坐标×100
        public const string HEARTBEAT   = "M99.0";
        // 工位2 (偏移10个地址)
        public const string TRIGGER_2   = "M110.0";
        public const string READY_2     = "M110.1";
        // ... 同理
    }

    public enum HandshakeState {
        Idle,           // 空闲，等待PLC触发
        TriggerReceived,// 收到触发信号
        Detecting,      // 正在执行检测
        ResultWritten,  // 结果已回写
        WaitingAck,     // 等待PLC确认
        Error           // 异常状态
    }

    private HandshakeState state = HandshakeState.Idle;
    private Stopwatch stateTimer = new Stopwatch();

    public DetectionResult ExecuteCycle(Func<DetectionResult> detectFunc) {
        state = HandshakeState.Idle;
        stateTimer.Restart();

        // 1. 告诉PLC视觉就绪
        WritePlc(Addr.READY_1, true);

        // 2. 等待触发信号（带超时）
        state = HandshakeState.Idle;
        while (!ReadPlcBool(Addr.TRIGGER_1)) {
            if (stateTimer.ElapsedMilliseconds > 30000)
                throw new TimeoutException("等待PLC触发超时30秒");
            Thread.Sleep(5);
        }

        // 3. 收到触发，清除就绪，设检测中
        state = HandshakeState.TriggerReceived;
        WritePlc(Addr.READY_1, false);
        WritePlc(Addr.DETECTING_1, true);

        // 4. 执行检测（带超时保护）
        state = HandshakeState.Detecting;
        DetectionResult result;
        try {
            var task = Task.Run(() => detectFunc());
            if (!task.Wait(5000))
                result = new DetectionResult { IsOk = false, DefectType = 99 }; // 超时码
            else
                result = task.Result;
        } catch (Exception ex) {
            result = new DetectionResult { IsOk = false, DefectType = 98 }; // 异常码
        }

        // 5. 回写结果
        state = HandshakeState.ResultWritten;
        WritePlc(Addr.RESULT_1, result.IsOk);
        if (!result.IsOk) {
            WritePlc(Addr.DEFECT_1, (short)result.DefectType);
            WritePlc(Addr.DEFECT_X_1, (short)(result.DefectX * 100));
            WritePlc(Addr.DEFECT_Y_1, (short)(result.DefectY * 100));
        }
        WritePlc(Addr.DETECTING_1, false);

        // 6. 复位触发信号（关键！）
        WritePlc(Addr.TRIGGER_1, false);

        // 7. 等待PLC确认（可选，确保PLC读到了结果）
        state = HandshakeState.WaitingAck;
        stateTimer.Restart();
        while (!ReadPlcBool(Addr.ACK_1)) {
            if (stateTimer.ElapsedMilliseconds > 2000) break; // 超时不等
            Thread.Sleep(2);
        }
        WritePlc(Addr.ACK_1, false);

        state = HandshakeState.Idle;
        return result;
    }

    private void WritePlc(string addr, object value) {
        lock (plcLock) { plc.Write(addr, value); }
    }
    private bool ReadPlcBool(string addr) {
        lock (plcLock) { return plc.ReadBool(addr).Content; }
    }
}`,

code:`// 视觉检测状态机框架
public class VisionStateMachine {
    public enum State {
        Idle,           // 空闲待命
        WaitingTrigger, // 等待PLC触发
        Grabbing,       // 相机采图
        Detecting,      // 算法检测
        WritingResult,  // PLC结果回写
        Logging,        // 图像/日志存档
        Error,          // 异常状态
        Recovering      // 自动恢复中
    }

    public State CurrentState { get; private set; } = State.Idle;
    private Stopwatch stateTimer = new Stopwatch();
    private int retryCount = 0;
    private const int MAX_RETRY = 3;

    // 状态超时配置
    private readonly Dictionary<State, int> timeouts = new() {
        {State.WaitingTrigger, 30000},  // 30秒
        {State.Grabbing, 3000},          // 3秒
        {State.Detecting, 5000},         // 5秒
        {State.WritingResult, 2000},     // 2秒
        {State.Logging, 1000},           // 1秒
        {State.Recovering, 5000}          // 5秒
    };

    // 状态转移事件
    public event Action<State, State> OnStateChanged;
    public event Action<State, string> OnError;
    public event Action<DetectionResult> OnDetectionComplete;

    public void TransitionTo(State newState) {
        var oldState = CurrentState;
        CurrentState = newState;
        stateTimer.Restart();
        retryCount = 0;
        OnStateChanged?.Invoke(oldState, newState);
    }

    // 主循环（在独立线程中运行）
    public void Run(CancellationToken token) {
        while (!token.IsCancellationRequested) {
            try {
                // 检查超时
                if (stateTimer.ElapsedMilliseconds > timeouts.GetValueOrDefault(CurrentState, 99999)) {
                    HandleTimeout();
                    continue;
                }

                switch (CurrentState) {
                    case State.Idle:
                        // 等待启动指令
                        if (plc.ReadBool(READY)) TransitionTo(State.WaitingTrigger);
                        break;

                    case State.WaitingTrigger:
                        if (plc.ReadBool(TRIGGER)) {
                            plc.Write(READY, false);
                            TransitionTo(State.Grabbing);
                        }
                        break;

                    case State.Grabbing:
                        var image = camera.Grab(2000);
                        if (image != null) {
                            currentImage = image;
                            TransitionTo(State.Detecting);
                        } else {
                            HandleError("采图超时");
                        }
                        break;

                    case State.Detecting:
                        var result = detector.Detect(currentImage);
                        currentResult = result;
                        TransitionTo(State.WritingResult);
                        break;

                    case State.WritingResult:
                        plc.Write(RESULT, result.IsOk);
                        plc.Write(TRIGGER, false);  // 复位触发
                        TransitionTo(State.Logging);
                        break;

                    case State.Logging:
                        logger.Save(currentImage, currentResult);
                        currentImage?.Dispose();
                        OnDetectionComplete?.Invoke(currentResult);
                        TransitionTo(State.Idle);
                        break;

                    case State.Error:
                        // 尝试自动恢复
                        if (retryCount < MAX_RETRY) {
                            retryCount++;
                            TransitionTo(State.Recovering);
                        } else {
                            OnError?.Invoke(CurrentState, "超过最大重试次数");
                            CurrentState = State.Idle; // 回到空闲等人工介入
                        }
                        break;

                    case State.Recovering:
                        // 恢复逻辑：重连相机/PLC
                        camera.Reconnect();
                        plc.Reconnect();
                        TransitionTo(State.Idle);
                        break;
                }
            } catch (Exception ex) {
                HandleError(ex.Message);
            }
            Thread.Sleep(5); // 防止CPU空转
        }
    }

    private void HandleTimeout() {
        OnError?.Invoke(CurrentState, $"状态 {CurrentState} 超时 {stateTimer.ElapsedMilliseconds}ms");
        TransitionTo(State.Error);
    }

    private void HandleError(string msg) {
        OnError?.Invoke(CurrentState, msg);
        TransitionTo(State.Error);
    }
}`,

"<b>线性代码无超时保护：</b>用while循环等触发信号，如果PLC通讯断了线程卡死。每个状态必须有超时自动跳Error",
"<b>Error状态不恢复：</b>进入Error后不自动尝试恢复，一直停着等人工。应该有最多3次自动重试，失败后才进维护模式",
"<b>状态切换不释放资源：</b>从Grabbing跳到Error时当前image没Dispose，内存泄漏。每次状态切换要检查是否有未释放资源"

scenario:"原来检测代码是线性的：while(true){等待触发→采图→检测→回写→存档}，没有异常处理和超时保护。相机断线时GrabImage一直阻塞，整个系统卡死。你改成状态机：每个状态都有超时(采图3秒/检测5秒/回写2秒)，超时自动进Error→尝试重连→重试3次→失败进入维护模式等人工。状态切换有事件通知，UI能实时显示当前状态。状态机架构让系统在异常时优雅降级而非崩溃。"

code:`// 配置管理与外部化完整实现
using Newtonsoft.Json;
using System.IO;

// 配置模型
public class AppConfig {
    // 相机配置
    public CameraConfig Camera { get; set; } = new();
    // PLC配置
    public PlcConfig Plc { get; set; } = new();
    // 检测配置
    public DetectionConfig Detection { get; set; } = new();
    // 路径配置
    public PathConfig Paths { get; set; } = new();
}

public class CameraConfig {
    public string Ip { get; set; } = "192.168.1.100";
    public double ExposureTime { get; set; } = 5000;
    public double Gain { get; set; } = 0;
    public string TriggerMode { get; set; } = "Hardware";
    public string TriggerSource { get; set; } = "Line0";
}

public class PlcConfig {
    public string Ip { get; set; } = "192.168.1.200";
    public int Port { get; set; } = 102;
    public string Model { get; set; } = "S7-1200";
    public string TriggerAddr { get; set; } = "M100.0";
    public string ResultAddr { get; set; } = "M200.0";
    public string HeartbeatAddr { get; set; } = "M99.0";
    public int HeartbeatInterval { get; set; } = 1000;
}

public class DetectionConfig {

// 配置管理器（单例+懒加载+自动生成默认配置）
public class ConfigManager {
    private static ConfigManager _instance;
    private static readonly object _lock = new();
    private AppConfig _config;

    public static ConfigManager Instance {
        get {
            if (_instance == null) {
                lock (_lock) {
                    if (_instance == null) _instance = new ConfigManager();
                }
            }
            return _instance;
        }
    }

    public AppConfig Config {
        get {
            if (_config == null) Load();
            return _config;
        }
    }

    private static string ConfigPath =>
        Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "appsettings.json");

    public void Load() {
        if (!File.Exists(ConfigPath)) {
            // 配置文件不存在 → 自动生成默认配置
            _config = new AppConfig();
            Save();
            Log.Info("配置文件不存在，已生成默认配置: " + ConfigPath);
        } else {
            string json = File.ReadAllText(ConfigPath);
            _config = JsonConvert.DeserializeObject<AppConfig>(json);
        }
    }

    public void Save() {
        string json = JsonConvert.SerializeObject(_config, Formatting.Indented);
        File.WriteAllText(ConfigPath, json);
    }

    // 加载产品配方
    public DetectionConfig LoadRecipe(string productName) {
        string recipePath = Path.Combine(
            AppDomain.CurrentDomain.BaseDirectory,
            Config.Paths.RecipeDir,
            productName + ".json");

        if (!File.Exists(recipePath)) {
            // 配方不存在 → 用默认检测配置
            return Config.Detection;
        }
        string json = File.ReadAllText(recipePath);
        return JsonConvert.DeserializeObject<DetectionConfig>(json);
    }

    // 保存当前参数为配方
    public void SaveRecipe(string productName, DetectionConfig config) {
        string recipePath = Path.Combine(
            AppDomain.CurrentDomain.BaseDirectory,
            Config.Paths.RecipeDir,
            productName + ".json");
        string json = JsonConvert.SerializeObject(config, Formatting.Indented);
        File.WriteAllText(recipePath, json);
    }
}`,

code:`// Halcon 内存管理与资源释放完整方案
using HalconDotNet;
using System.Diagnostics;

public class HalconProcessor : IDisposable {
    private HTuple modelHandle;
    private bool disposed = false;

    // 模板句柄在构造时创建
    public HalconProcessor(string modelPath) {
        HOperatorSet.ReadShapeModel(modelPath, out modelHandle);
    }

    // 检测方法：try-finally确保所有HObject释放
    public DetectionResult Detect(HObject image) {
        HObject grayImage = null, thresholdRegion = null;
        HObject connectedRegions = null, selectedRegions = null;
        HObject transformedROI = null, detectionImage = null;

        try {
            // 灰度化
            HOperatorSet.Rgb1ToGray(image, out grayImage);

            // 模板匹配
            HTuple row, col, angle, score;
            HOperatorSet.FindShapeModel(grayImage, modelHandle,
                -0.17, 0.35, 0.5, 1, 0.8,
                "least_squares", 0, 0.9,
                out row, out col, out angle, out score);

            if (score.Length == 0)
                return new DetectionResult { IsOk = false, DefectType = "NOT_FOUND" };

            // 生成定位ROI
            HOperatorSet.VectorAngleToRigid(
                0, 0, 0, row[0].D, col[0].D, angle[0].D,
                out HTuple homMat2D);
            HOperatorSet.GenRectangle1(out transformedROI,
                100, 100, 400, 500);
            HOperatorSet.AffineTransRegion(transformedROI,
                out transformedROI, homMat2D, "false");
            HOperatorSet.ReduceDomain(grayImage, transformedROI,
                out detectionImage);

            // 阈值检测
            HOperatorSet.Threshold(detectionImage,
                out thresholdRegion, 0, 80);
            HOperatorSet.Connection(thresholdRegion,
                out connectedRegions);
            HOperatorSet.SelectShape(connectedRegions,
                out selectedRegions, "area", "and", 50, 99999);

            HTuple area, areaRow, areaCol;
            HOperatorSet.AreaCenter(selectedRegions,
                out area, out areaRow, out areaCol);

            return new DetectionResult {
                IsOk = area.Length == 0,
                DefectCount = area.Length
            };
        } finally {
            // ★ 关键：finally中释放所有HObject
            SafeDisposeAll(grayImage, thresholdRegion,
                connectedRegions, selectedRegions,
                transformedROI, detectionImage);
        }
    }

    // 批量释放方法
    public static void SafeDisposeAll(params HObject[] objects) {
        foreach (var obj in objects) {
            if (obj != null && obj.IsInitialized()) {
                obj.Dispose();
            }
        }
    }

    // 内存监控
    public static void CheckMemory(string tag = "") {
        HTuple memAllocated;
        HOperatorSet.GetSystem("mem_allocated", out memAllocated);
        long memMB = memAllocated.L / (1024 * 1024);
        Trace.WriteLine($"[Halcon Memory{tag}] {memMB} MB");

        // 同时检查.NET进程内存
        var proc = Process.GetCurrentProcess();
        Trace.WriteLine($"[.NET Memory{tag}] {proc.WorkingSet64 / (1024*1024)} MB");
    }

    // IDisposable 实现
    public void Dispose() {
        Dispose(true);
        GC.SuppressFinalize(this);
    }

    protected virtual void Dispose(bool disposing) {
        if (disposed) return;
        if (disposing) {
            // 释放托管资源
        }
        // 释放非托管资源（Halcon句柄）
        if (modelHandle != null) {
            HOperatorSet.ClearShapeModel(modelHandle);
            modelHandle.Dispose();
        }
        disposed = true;
    }

    ~HalconProcessor() {
        Dispose(false);
    }
}

// 使用示例
public class DetectionService {
    private HalconProcessor processor;

    public void Init() {
        processor = new HalconProcessor("Models/product.shm");
        HalconProcessor.CheckMemory("- 初始化后");
    }

    public void Run1000Cycles(HObject testImage) {
        for (int i = 0; i < 1000; i++) {
            var result = processor.Detect(testImage);

            if (i % 100 == 0) {
                HalconProcessor.CheckMemory($"- 第{i}次检测后");
            }
        }
        // 如果内存稳定不增长 → 无泄漏
    }
}`,

public class DimensionMeasurer {
    public MeasurementResult Measure(HObject image) {
        HObject grayImage = null, edges = null, longEdges = null;
        HTuple rowBeg, colBeg, rowEnd, colEnd, nr, nc, dist;
        try {
            HOperatorSet.Rgb1ToGray(image, out grayImage);

            // 亚像素边缘
            HOperatorSet.EdgesSubPix(grayImage, out edges,
                "canny", 1.5, 20, 40);
            HOperatorSet.SelectContoursXld(edges, out longEdges,
                "contour_length", 30, 99999, -0.5, 0.5);

            // 拟合直线
            HOperatorSet.FitLineContourXld(longEdges,
                "tukey", -1, 0, 5, 2,
                out rowBeg, out colBeg, out rowEnd, out colEnd,
                out nr, out nc, out dist);

            // 计算尺寸
            HTuple distance;
            HOperatorSet.DistancePp(rowBeg, colBeg, rowEnd, colEnd,
                out distance);

            return new MeasurementResult {
                Length = distance.D,
                Unit = "mm"  // 需要标定矩阵转换
            };
        } finally {
            HalconProcessor.SafeDisposeAll(grayImage, edges, longEdges);
        }
    }
}`,

code:`// 异常恢复与断线重连完整实现
public class ReliabilityManager {
    // ===== 相机断线重连 =====
    public class CameraWatchdog {
        private HikCamera camera;
        private bool isConnected = false;
        private DateTime lastFrameTime;
        private Thread reconnectThread;
        private CancellationTokenSource cts;

        public void StartMonitoring() {
            // 采集超时检测线程
            new Thread(() => {
                while (!cts.Token.IsCancellationRequested) {
                    if (isConnected &&
                        (DateTime.Now - lastFrameTime).TotalSeconds > 10) {
                        // 10秒没收到图 → 判定断线
                        isConnected = false;
                        Log.Error("相机断线，启动重连...");
                        camera.Stop(); // 停止旧连接
                        StartReconnect();
                    }
                    Thread.Sleep(2000);
                }
            }) { IsBackground = true }.Start();
        }

        private void StartReconnect() {
            reconnectThread = new Thread(() => {
                while (!isConnected && !cts.Token.IsCancellationRequested) {
                    try {
                        if (camera.Connect(cameraIp)) {
                            isConnected = true;
                            lastFrameTime = DateTime.Now;
                            camera.StartGrab(img => {
                                lastFrameTime = DateTime.Now;
                                OnImageReady?.Invoke(img);
                            });
                            Log.Info("相机重连成功");
                            break;
                        }
                    } catch (Exception ex) {
                        Log.Error("重连失败: " + ex.Message);
                    }
                    Thread.Sleep(3000); // 3秒重试间隔
                }
            }) { IsBackground = true };
            reconnectThread.Start();
        }
    }

    // ===== PLC心跳双定时器 =====
    public class PlcHeartbeat {
        private SiemensS7Net plc;
        private bool heartbeatToggle = false;
        private bool plcConnected = false;

        public void Start() {
            // 定时器1：每秒写心跳
            new Timer(_ => {
                if (!plcConnected) return;
                try {
                    heartbeatToggle = !heartbeatToggle;
                    plc.Write("M99.0", heartbeatToggle);
                } catch {
                    plcConnected = false;
                    Log.Error("PLC心跳写入失败");
                }
            }, null, 0, 1000);

            // 定时器2：每3秒检测心跳读回+重连
            new Timer(_ => {
                if (!plcConnected) {
                    try {
                        var result = plc.Connect();
                        if (result.IsSuccess) {
                            plcConnected = true;
                            Log.Info("PLC重连成功");
                        }
                    } catch { }
                }
            }, null, 0, 3000);
        }
    }

    // ===== 算法异常分级处理 =====
    public class AlgorithmResilience {
        private int retryCount = 0;
        private const int MAX_RETRY = 3;

        public DetectionResult ExecuteWithResilience(
            Func<DetectionResult> detectFunc) {
            try {
                var result = detectFunc();
                retryCount = 0; // 成功则重置计数
                return result;
            } catch (Exception ex) {
                retryCount++;
                Log.Error($"检测异常(第{retryCount}次): {ex.Message}");

                if (retryCount <= MAX_RETRY) {
                    // Level1: 重试
                    Log.Warn($"第{retryCount}次重试...");
                    Thread.Sleep(500);
                    return ExecuteWithResilience(detectFunc);
                } else if (retryCount <= MAX_RETRY + 2) {
                    // Level2: 降级检测
                    Log.Warn("降级模式：仅执行基础检测");
                    return ExecuteBasicDetection();
                } else {
                    // Level3: 报警停机
                    Log.Error("超过最大重试，报警停机");
                    Alarm.Trigger(AlarmLevel.Critical, "检测系统异常停机");
                    return new DetectionResult {
                        IsOk = false, DefectType = "SYSTEM_ERROR"
                    };
                }
            }
        }
    }

    // ===== 看门狗 =====
    public class Watchdog {
        private DateTime lastHeartbeat;
        private Timer timer;

        public void Start(int timeoutSec, Action onTimeout) {
            lastHeartbeat = DateTime.Now;
            timer = new Timer(_ => {
                if ((DateTime.Now - lastHeartbeat).TotalSeconds > timeoutSec) {
                    Log.Error("看门狗超时！主流程可能卡死");
                    onTimeout?.Invoke(); // 强制重启
                }
            }, null, 0, 2000);
        }

        public void Feed() { lastHeartbeat = DateTime.Now; }
    }
}`,

code:`// 图像存档与数据追溯体系
using System.IO;
using SQLite;

public class ImageArchiveService {
    private string baseDir;
    private ArchivePolicy policy;
    private SQLiteConnection db;

    // 存档策略
    public class ArchivePolicy {
        public bool SaveOK { get; set; } = false;  // 默认不存OK图
        public bool SaveNG { get; set; } = true;    // 存NG图
        public string Format { get; set; } = "jpg"; // jpg省空间，png无损
        public int Quality { get; set; } = 85;      // JPG质量
        public int RetentionDays { get; set; } = 30;// 保留30天
        public long MinDiskSpaceGB { get; set; } = 5;// 磁盘剩余<5GB时清理
    }

    // 元数据记录
    public class ImageRecord {
        [PrimaryKey, AutoIncrement]
        public int Id { get; set; }
        public string Timestamp { get; set; }
        public string Barcode { get; set; }
        public bool IsOk { get; set; }
        public string DefectType { get; set; }
        public string FilePath { get; set; }
        public double CycleTime { get; set; }
    }

    public void Init(string baseDir, ArchivePolicy policy) {
        this.baseDir = baseDir;
        this.policy = policy;

        // 初始化SQLite数据库
        string dbPath = Path.Combine(baseDir, "archive.db");
        db = new SQLiteConnection(dbPath);
        db.CreateTable<ImageRecord>();

        // 启动磁盘清理定时器（每小时检查一次）
        new Timer(_ => CleanOldImages(), null, 0, 3600000);
    }

    public string SaveImage(HObject image, DetectionResult result) {
        // 根据策略决定是否存档
        if (result.IsOk && !policy.SaveOK) return null;
        if (!result.IsOk && !policy.SaveNG) return null;

        // 三级目录: baseDir/20260814/NG/
        string dateDir = DateTime.Now.ToString("yyyyMMdd");
        string resultDir = result.IsOk ? "OK" : "NG";
        string dir = Path.Combine(baseDir, dateDir, resultDir);
        Directory.CreateDirectory(dir);

        // 文件名: 143025_123_SN001_NG.png
        string fileName = $"{DateTime.Now:HHmmssfff}_" +
            $"{result.Barcode ?? "NOSN"}_" +
            $"{(result.IsOk ? "OK" : "NG")}." +
            $"{policy.Format}";

        string fullPath = Path.Combine(dir, fileName);

        // Halcon保存图像
        if (policy.Format == "png") {
            HOperatorSet.WriteImage(image, "png", 0, fullPath);
        } else {
            HOperatorSet.WriteImage(image, "jpeg", policy.Quality, fullPath);
        }

        // 记录到数据库
        db.Insert(new ImageRecord {
            Timestamp = DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss"),
            Barcode = result.Barcode,
            IsOk = result.IsOk,
            DefectType = result.DefectType ?? "",
            FilePath = fullPath,
            CycleTime = result.CycleTime
        });

        return fullPath;
    }

    // 历史检索
    public List<ImageRecord> Search(DateTime? start, DateTime? end,
        string barcode, bool? isOk, string defectType) {
        var query = db.Table<ImageRecord>().Where(r => true);
        if (start.HasValue)
            query = query.Where(r => r.Timestamp >= start.Value.ToString());
        if (end.HasValue)
            query = query.Where(r => r.Timestamp <= end.Value.ToString());
        if (!string.IsNullOrEmpty(barcode))
            query = query.Where(r => r.Barcode.Contains(barcode));
        if (isOk.HasValue)
            query = query.Where(r => r.IsOk == isOk.Value);
        if (!string.IsNullOrEmpty(defectType))
            query = query.Where(r => r.DefectType == defectType);

        return query.OrderByDescending(r => r.Timestamp).Take(1000).ToList();
    }

    // 磁盘空间管理
    private void CleanOldImages() {
        // 检查磁盘剩余空间
        var drive = new DriveInfo(Path.GetPathRoot(baseDir));
        if (drive.AvailableFreeSpace / (1024*1024*1024) < policy.MinDiskSpaceGB) {
            Log.Warn("磁盘空间不足，开始清理旧图像");
            // 删除超过保留天数的图像
            var cutoff = DateTime.Now.AddDays(-policy.RetentionDays);
            var oldRecords = db.Table<ImageRecord>()
                .Where(r => r.Timestamp.CompareTo(
                    cutoff.ToString("yyyy-MM-dd")) < 0);
            foreach (var rec in oldRecords) {
                if (File.Exists(rec.FilePath)) File.Delete(rec.FilePath);
                db.Delete(rec);
            }
        }
    }
}`,

using System.IO;
using System.Diagnostics;

public class ProductionLogger {
    private string logDir;
    private StreamWriter csvWriter;
    private string currentDate;

    // 实时统计
    public class ProductionStats {
        public int OkCount { get; set; }
        public int NgCount { get; set; }
        public int TotalCount => OkCount + NgCount;
        public double Yield => TotalCount > 0
            ? Math.Round((double)OkCount / TotalCount * 100, 1) : 0;
        public string YieldColor => Yield >= 95 ? "Green"
            : Yield >= 85 ? "Orange" : "Red";

        // 缺陷分布
        public Dictionary<string, int> DefectDistribution { get; set; }
            = new();

        // 耗时统计
        public class CycleTimeBreakdown {
            public double GrabMs { get; set; }
            public double DetectMs { get; set; }
            public double PlcMs { get; set; }
            public double TotalMs => GrabMs + DetectMs + PlcMs;
            public string Bottleneck =>
                GrabMs >= DetectMs && GrabMs >= PlcMs ? "采图"
                : DetectMs >= PlcMs ? "检测" : "PLC通讯";
        }
        public CycleTimeBreakdown AvgCycleTime { get; set; } = new();
    }

    public void Init(string logDir) {
        this.logDir = logDir;
        Directory.CreateDirectory(logDir);
        EnsureCsvWriter();
    }

    // 记录一条检测结果
    public void Log(DetectionResult result, Stopwatch sw) {
        EnsureCsvWriter();
        string line = string.Join(",",
            DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss.fff"),
            result.Barcode ?? "",
            result.IsOk ? "OK" : "NG",
            result.DefectType ?? "",
            $"{sw.Elapsed.TotalMilliseconds:F0}",
            result.ImagePath ?? ""
        );
        csvWriter.WriteLine(line);
        csvWriter.Flush();
    }

    // 确保CSV按日期分文件
    private void EnsureCsvWriter() {
        string today = DateTime.Now.ToString("yyyy-MM-dd");
        if (today != currentDate) {
            currentDate = today;
            csvWriter?.Close();
            string path = Path.Combine(logDir, $"production_{today}.csv");
            bool exists = File.Exists(path);
            csvWriter = new StreamWriter(path, true);
            if (!exists) {
                csvWriter.WriteLine(
                    "Time,Barcode,Result,DefectType,CycleMs,ImagePath");
            }
        }
    }

        int ok = records.Count(r => r.IsOk);
        int ng = records.Count(r => !r.IsOk);
        double yield = records.Count > 0

        var defectTop5 = records.Where(r => !r.IsOk)
            .GroupBy(r => r.DefectType)
            .Select(g => new { Defect = g.Key, Count = g.Count() })
            .OrderByDescending(x => x.Count).Take(5);

        var avgCycle = records.Average(r => r.CycleMs);

        string report = $"===== 班次报表 =====\\n" +
            $"时段: {shiftStart:HH:mm} - {shiftEnd:HH:mm}\\n" +
            $"总数: {records.Count}  OK: {ok}  NG: {ng}\\n" +
            $"良率: {yield:F1}%\\n" +
            $"平均节拍: {avgCycle:F0}ms\\n" +
            $"缺陷TOP5:\\n";
        foreach (var d in defectTop5)
            report += $"  {d.Defect}: {d.Count}次\\n";
        return report;

code:`// MES系统对接与数据上报
using System.Net.Http;
using System.Text;
using Newtonsoft.Json;
using SQLite;

public class MesReporter {
    private HttpClient client;
    private string mesApiUrl;
    private SQLiteConnection cacheDb; // 断网缓存
    private Timer retryTimer;

    // 上报数据模型
    public class MesReport {
        public string Timestamp { get; set; }
        public string SerialNumber { get; set; }
        public string Result { get; set; }  // OK/NG
        public string DefectType { get; set; }
        public double CycleTime { get; set; }
        public string WorkstationId { get; set; }
        public string OperatorId { get; set; }
    }

    public void Init(string apiUrl) {
        mesApiUrl = apiUrl;
        client = new HttpClient {
            Timeout = TimeSpan.FromSeconds(30)
        };
        client.DefaultRequestHeaders.Add("Authorization", "Bearer token");

        // 初始化本地缓存数据库
        cacheDb = new SQLiteConnection("cache.db");
        cacheDb.CreateTable<MesReport>();

        // 每30秒重试缓存中失败的上报
        retryTimer = new Timer(_ => RetryCachedReports(),
            null, 30000, 30000);
    }

    // 上报检测结果
    public async Task ReportAsync(DetectionResult result) {
        var report = new MesReport {
            Timestamp = DateTime.Now.ToString("O"),
            SerialNumber = result.Barcode,
            Result = result.IsOk ? "OK" : "NG",
            DefectType = result.DefectType ?? "",
            CycleTime = result.CycleTime,
            WorkstationId = Environment.MachineName,
            OperatorId = AuthService.CurrentUser?.Username
        };

        try {
            // 直接上报
            await SendToMes(report);
        } catch {
            // 上报失败 → 缓存到本地
            cacheDb.Insert(report);
            Log.Warn("MES上报失败，已缓存到本地等待重试");
        }
    }

    private async Task SendToMes(MesReport report) {
        string json = JsonConvert.SerializeObject(report);
        var content = new StringContent(json, Encoding.UTF8,
            "application/json");

        // 重试3次
        for (int i = 0; i < 3; i++) {
            try {
                var response = await client.PostAsync(
                    mesApiUrl + "/api/inspection/result", content);
                if (response.IsSuccessStatusCode) return;
                // 幂等：MES端用SN+Timestamp做唯一键
            } catch (HttpRequestException ex) {
                Log.Error($"MES上报第{i+1}次失败: {ex.Message}");
                if (i < 2) await Task.Delay(2000 * (i + 1));
            }
        }
        throw new Exception("MES上报3次均失败");
    }

    // 断网恢复后重试缓存
    private async void RetryCachedReports() {
        var cached = cacheDb.Table<MesReport>()
            .OrderBy(r => r.Timestamp).Take(100);

        foreach (var report in cached) {
            try {
                await SendToMes(report);
                cacheDb.Delete(report); // 上报成功→删除缓存
                Log.Info($"缓存数据补传成功: {report.SerialNumber}");
            } catch {
                break; // 仍然失败→停止重试等下次
            }
        }
    }
}

// 简化版：用中间数据库表对接MES
public class MesDbBridge {
    // 视觉系统写入 → MES系统读取 → 读后删除
    public void WriteResult(DetectionResult result) {
        string sql = @"INSERT INTO VISION_RESULTS
            (SN, RESULT, DEFECT_TYPE, TIMESTAMP, PROCESSED)
            VALUES (@sn, @result, @defect, @time, 0)";

    }
}`,

code:`// SPC 统计过程控制实现
using System.Linq;
using LiveCharts; // 图表库

public class SpcAnalyzer {
    // ===== X-bar R 控制图 =====
    public ControlChartData CalcXBarR(List<double> measurements,
        int groupSize = 5) {
        // 分组
        var groups = measurements
            .Select((m, i) => new { m, i })
            .GroupBy(x => x.i / groupSize)
            .Select(g => g.Select(x => x.m).ToList())
            .ToList();

        // 计算每组的均值和极差
        var xBars = groups.Select(g => g.Average()).ToList();
        var ranges = groups.Select(g => g.Max() - g.Min()).ToList();

        // 总均值和平均极差
        double xBarBar = xBars.Average();
        double rBar = ranges.Average();

        // 控制限系数（n=5时A2=0.577, D3=0, D4=2.114）
        double A2 = 0.577, D4 = 2.114;

        return new ControlChartData {
            CenterLine = xBarBar,
            UCL = xBarBar + A2 * rBar,  // 上控制限
            LCL = xBarBar - A2 * rBar,  // 下控制限
            DataPoints = xBars,
            // 检测漂移：连续7点在中心线同侧
            IsDrifted = CheckDrift(xBars, xBarBar)
        };
    }

    // 漂移检测：连续7点同侧
    private bool CheckDrift(List<double> data, double center) {
        if (data.Count < 7) return false;
        int consecutive = 0;
        bool above = data[0] > center;
        foreach (var d in data) {
            if ((d > center) == above) {
                consecutive++;
                if (consecutive >= 7) return true;
            } else {
                above = !above;
                consecutive = 1;
            }
        }
        return false;
    }

    // ===== 帕累托图 =====
    public ParetoData CalcPareto(List<string> defectTypes) {
        var defects = defectTypes
            .GroupBy(d => d)
            .Select(g => new {
                Defect = g.Key,
                Count = g.Count(),
                Percent = (double)g.Count() / defectTypes.Count * 100
            })
            .OrderByDescending(x => x.Count)
            .ToList();

        // 累计百分比
        double cumulative = 0;
        var cumulativePercents = new List<double>();
        foreach (var d in defects) {
            cumulative += d.Percent;
            cumulativePercents.Add(cumulative);
        }

        return new ParetoData {
            Defects = defects.Select(d => d.Defect).ToList(),
            Counts = defects.Select(d => (double)d.Count).ToList(),
            CumulativePercents = cumulativePercents
        };
    }

    // ===== Cpk 过程能力指数 =====
    public CpkResult CalcCpk(List<double> measurements,
        double USL, double LSL) {
        double mean = measurements.Average();
        double stdDev = Math.Sqrt(
            measurements.Sum(m => Math.Pow(m - mean, 2))
            / (measurements.Count - 1));

        double cpu = (USL - mean) / (3 * stdDev);
        double cpl = (mean - LSL) / (3 * stdDev);
        double cpk = Math.Min(cpu, cpl);

        return new CpkResult {
            Mean = mean,
            StdDev = stdDev,
            Cpu = cpu,
            Cpl = cpl,
            Cpk = cpk,
            Level = cpk >= 1.33 ? "合格" : cpk >= 1.0 ? "勉强" : "不合格",
            Recommendation = cpk < 1.33
                ? "Cpk不达标，需调整工艺参数减小变异或修正均值偏移"
                : "过程能力满足要求"
        };
    }
}

// WPF 图表显示

    public SeriesCollection ControlChartSeries { get; set; }
    public SeriesCollection ParetoSeries { get; set; }

        UCL = data.UCL;
        LCL = data.LCL;
        ControlChartSeries = new SeriesCollection {
            new LineSeries { Values = new ChartValues<double>(data.DataPoints) }
        };
    }
}`,

code:`// 报警系统与故障诊断
using System.Collections.ObjectModel;

public class AlarmSystem {
    // 报警级别
    public enum AlarmLevel { Info, Warning, Critical }

    // 报警模型
    public class Alarm {
        public string Code { get; set; }        // E001
        public AlarmLevel Level { get; set; }
        public string Title { get; set; }       // 相机断线
        public string Description { get; set; } // 详细描述
        public string Solution { get; set; }    // 修复建议
        public DateTime Timestamp { get; set; }
        public bool IsActive { get; set; }      // 当前是否活跃
        public string Handler { get; set; }     // 处理人
        public DateTime? ResolvedTime { get; set; }
    }

    // 故障码映射表
    private static readonly Dictionary<string, Alarm> FaultCodeMap = new() {
        ["E001"] = new Alarm {
            Code="E001", Level=AlarmLevel.Critical,
            Title="相机断线",
            Description="相机网络连接中断，无法采集图像",
            Solution="1.检查相机网线是否松动 2.检查相机IP是否冲突 3.重启相机电源 4.系统将自动尝试重连"
        },
        ["E002"] = new Alarm {
            Code="E002", Level=AlarmLevel.Critical,
            Title="PLC通讯断线",
            Description="PLC S7通讯连接中断",
            Solution="1.检查PLC网线 2.检查PLC IP配置 3.检查PLC是否运行 4.系统将自动尝试重连"
        },
        ["E101"] = new Alarm {
            Code="E101", Level=AlarmLevel.Warning,
            Title="模板匹配未找到",
            Description="find_shape_model未匹配到目标",
            Solution="1.检查产品是否到位 2.调整min_score参数 3.重新创建模板 4.检查照明是否正常"
        },
        ["E102"] = new Alarm {
            Code="E102", Level=AlarmLevel.Warning,
            Title="检测超时",
            Description="检测耗时超过5秒限制",
            Solution="1.优化算法参数(greediness) 2.减小ROI范围 3.检查PC性能 4.降低金字塔层数"
        },
        ["E201"] = new Alarm {
            Code="E201", Level=AlarmLevel.Critical,
            Title="MES上报失败",
            Description="MES数据上报连续失败",
            Solution="1.检查MES服务器是否可达 2.检查API接口是否变更 3.数据已缓存等待自动补传"
        },
        ["E301"] = new Alarm {
            Code="E301", Level=AlarmLevel.Warning,
            Title="良率低于阈值",
            Description="当前良率低于85%",
            Solution="1.检查最近NG图像分析原因 2.检查照明是否稳定 3.检查模板是否需要更新 4.检查产品是否有批次问题"
        },
    };

    // 当前活跃报警
    public ObservableCollection<Alarm> ActiveAlarms { get; set; } = new();

    // 报警历史
    private SQLiteConnection historyDb;

    public void Init() {
        historyDb = new SQLiteConnection("alarms.db");
        historyDb.CreateTable<Alarm>();
    }

    // 触发报警
    public void Trigger(string code, string additionalInfo = null) {
        // 检查是否已有同code的活跃报警
        if (ActiveAlarms.Any(a => a.Code == code)) return;

        var alarm = FaultCodeMap.ContainsKey(code)
            ? CloneAlarm(FaultCodeMap[code]) : new Alarm {
                Code = code, Level = AlarmLevel.Info,
                Title = "未知故障", Description = code
            };

        alarm.Timestamp = DateTime.Now;
        alarm.IsActive = true;
        if (additionalInfo != null)
            alarm.Description += " | " + additionalInfo;

        // 添加到活跃列表
        App.Current.Dispatcher.Invoke(() => ActiveAlarms.Add(alarm));

        // 记录历史
        historyDb.Insert(CloneAlarm(alarm));

        // 根据级别执行动作
        switch (alarm.Level) {
            case AlarmLevel.Critical:
                Log.Error($"严重报警: [{code}] {alarm.Title}");
                // 停机 + 声光报警
                StateMachine.TransitionTo(State.Error);
                SoundPlayer.Play("alarm_critical.wav");
                LightController.TurnOn(Light.Red, blink: true);
                break;
            case AlarmLevel.Warning:
                Log.Warn($"警告: [{code}] {alarm.Title}");
                SoundPlayer.Play("alarm_warning.wav");
                break;
            case AlarmLevel.Info:
                Log.Info($"提示: [{code}] {alarm.Title}");
                break;
        }
    }

    // 解除报警
    public void Resolve(string code, string handler) {
        var alarm = ActiveAlarms.FirstOrDefault(a => a.Code == code);
        if (alarm != null) {
            alarm.IsActive = false;
            alarm.Handler = handler;
            alarm.ResolvedTime = DateTime.Now;
            App.Current.Dispatcher.Invoke(() => ActiveAlarms.Remove(alarm));
            historyDb.Update(alarm);
            Log.Info($"报警已解除: [{code}] by {handler}");
        }
    }

    // 一键复位
    public void ResetAll(string handler) {
        foreach (var alarm in ActiveAlarms.ToList()) {
            Resolve(alarm.Code, handler);
        }
        // 重置设备
        SoundPlayer.Stop();
        LightController.TurnOff();
        // 尝试恢复
        StateMachine.TransitionTo(State.Recovering);
    }

    private Alarm CloneAlarm(Alarm src) =>
        new Alarm {
            Code=src.Code, Level=src.Level, Title=src.Title,
            Description=src.Description, Solution=src.Solution
        };
}`,

using Xunit;
using HalconDotNet;

public class HalconDetectorTests {
    private HalconDetector detector;

    public HalconDetectorTests() {
        detector = new HalconDetector();
        detector.LoadModel("TestData/product_model.shm");
    }

    [Theory]
    [InlineData("TestData/ok_001.png", true)]
    [InlineData("TestData/ok_002.png", true)]
    [InlineData("TestData/ok_003.png", true)]
    [InlineData("TestData/ng_scratch_001.png", false)]
    [InlineData("TestData/ng_dent_001.png", false)]
    public void Detect_ReturnsCorrectResult(string imagePath, bool expectedOk) {
        // Arrange
        HObject image;
        HOperatorSet.ReadImage(out image, imagePath);

        // Act
        var result = detector.Detect(image);

        // Assert
        Assert.Equal(expectedOk, result.IsOk);

        // Cleanup
        image.Dispose();
    }

    [Fact]
    public void Detect_EmptyImage_ThrowsException() {
        HObject emptyImage;
        HOperatorSet.GenImageConst(out emptyImage, "byte", 640, 480);

        Assert.Throws<HalconException>(() => detector.Detect(emptyImage));

        emptyImage.Dispose();
    }

    [Fact]
    public void Detect_NullImage_ThrowsArgumentNullException() {
        Assert.Throws<ArgumentNullException>(() => detector.Detect(null));
    }
}

// ===== 金标准回归测试 =====
public class GoldenStandardRegressionTests {
    private HalconDetector detector;
    private List<GoldenSample> goldenSet;

    public class GoldenSample {
        public string ImagePath { get; set; }
        public bool ExpectedOk { get; set; }
        public string ExpectedDefectType { get; set; }
    }

    public GoldenStandardRegressionTests() {
        detector = new HalconDetector();
        detector.LoadModel("Models/product.shm");
        // 加载金标准样本集
        goldenSet = LoadGoldenSet("TestData/golden_standard.json");
    }

    [Fact]
    public void RegressionTest_DetectionRateAbove95Percent() {
        int truePositive = 0;  // 正确检出NG
        int trueNegative = 0;  // 正确判定OK
        int falsePositive = 0; // 误检(OK判NG)
        int falseNegative = 0; // 漏检(NG判OK)

        foreach (var sample in goldenSet) {
            HObject image;
            HOperatorSet.ReadImage(out image, sample.ImagePath);
            var result = detector.Detect(image);
            image.Dispose();

            if (sample.ExpectedOk && result.IsOk) trueNegative++;
            else if (sample.ExpectedOk && !result.IsOk) falsePositive++;
            else if (!sample.ExpectedOk && !result.IsOk) truePositive++;
            else falseNegative++;
        }

        double detectionRate = (double)truePositive /
            (truePositive + falseNegative) * 100;
        double falseAlarmRate = (double)falsePositive /
            (falsePositive + trueNegative) * 100;

        // 检出率必须≥95%
        Assert.True(detectionRate >= 95,
            $"检出率{detectionRate:F1}%低于95%标准");
        // 误检率必须≤5%
        Assert.True(falseAlarmRate <= 5,
            $"误检率{falseAlarmRate:F1}%高于5%标准");
    }

    private List<GoldenSample> LoadGoldenSet(string path) {
        string json = File.ReadAllText(path);
        return JsonConvert.DeserializeObject<List<GoldenSample>>(json);
    }
}

code:`// 多相机协同与工位调度系统
public class MultiCameraSystem {
    private List<CameraStation> stations = new();
    private ResultAggregator aggregator;

    // 单个工位
    public class CameraStation {
        public int Id { get; set; }
        public string Name { get; set; }
        public HikCamera Camera { get; set; }
        public HalconDetector Detector { get; set; }
        public BlockingCollection<HObject> ImageQueue { get; set; }
        public Thread ProcessThread { get; set; }
        public CancellationTokenSource Cts { get; set; }

        public void Start() {
            Cts = new CancellationTokenSource();
            ImageQueue = new BlockingCollection<HObject>(3);
            Camera.StartGrab(img => {
                try { ImageQueue.Add(img, Cts.Token); }
                catch (OperationCanceledException) { }
            });

            ProcessThread = new Thread(() => {
                while (!Cts.Token.IsCancellationRequested) {
                    try {
                        var image = ImageQueue.Take(Cts.Token);
                        var result = Detector.Detect(image);
                        image.Dispose();

                        // 附加工位信息
                        result.StationId = Id;
                        result.StationName = Name;

                        // 发送到结果汇总器
                        OnResultReady?.Invoke(result);
                    } catch (OperationCanceledException) {
                        break;
                    }
                }
            }) { IsBackground = true, Name = $"Station_{Name}" };
            ProcessThread.Start();
        }

        public event Action<DetectionResult> OnResultReady;
    }

    // 结果汇总器
    public class ResultAggregator {
        // 按SN分组存储各工位结果
        private ConcurrentDictionary<string, ProductResults>
            pendingResults = new();

        public class ProductResults {
            public string SerialNumber { get; set; }
            public Dictionary<int, DetectionResult> StationResults
                = new();
            public int ExpectedStations { get; set; }
            public bool IsComplete =>
                StationResults.Count >= ExpectedStations;

            public DetectionResult GetFinalResult() {
                // 任一工位NG则产品NG
                bool allOk = StationResults.Values.All(r => r.IsOk);
                var defects = StationResults.Values
                    .Where(r => !r.IsOk)
                    .Select(r => $"{r.StationName}:{r.DefectType}");
                return new DetectionResult {
                    IsOk = allOk,
                    DefectType = string.Join("|", defects),
                    Barcode = SerialNumber
                };
            }
        }

        public void AddResult(DetectionResult result) {
            var product = pendingResults.GetOrAdd(
                result.Barcode,
                new ProductResults {
                    SerialNumber = result.Barcode,
                    ExpectedStations = 4 // 4个工位
                }
            );
            product.StationResults[result.StationId] = result;

            if (product.IsComplete) {
                // 所有工位检测完成 → 输出最终结果
                var final = product.GetFinalResult();
                OnProductComplete?.Invoke(final);
                pendingResults.TryRemove(result.Barcode, out _);
            }
        }

        public event Action<DetectionResult> OnProductComplete;
    }

    public void AddStation(CameraStation station) {
        station.OnResultReady += (result) => {
            aggregator.AddResult(result);
        };
        stations.Add(station);
    }

    public void StartAll() {
        aggregator = new ResultAggregator();
        aggregator.OnProductComplete += (finalResult) => {
            // 回写PLC最终结果
            plc.Write("M200.0", finalResult.IsOk);
            // 存档
            logger.Save(finalResult);
        };
        stations.ForEach(s => s.Start());
    }

    // 多相机同步触发（通过PLC硬件触发信号）
    public void TriggerAllCameras() {
        // PLC输出一个触发信号→分配器→同时触发所有相机
        plc.Write("M300.0", true);  // 触发信号
        Thread.Sleep(10);

code:`// 视觉系统五层架构与插件化设计

// ===== 层1: 设备层 - 硬件抽象接口 =====
public interface ICamera {
    bool Connect(string ip);
    void StartGrab(Action<HObject> onImage);
    void Stop();
    void Reconnect();
}

public interface IPlcCommunicator {
    bool Connect(string ip);
    bool ReadBool(string addr);
    void Write(string addr, object value);
    event EventHandler Disconnected;
}

// ===== 层2: 数据层 - 数据管理接口 =====
public interface IImageStore {
    void Save(HObject image, DetectionResult result);
    List<DetectionResult> Search(SearchFilter filter);
}

public interface IConfigProvider {
    T GetConfig<T>() where T : new();
    void SaveConfig<T>(T config);
    T LoadRecipe(string productName);
}

// ===== 层3: 算法层 - 插件化接口 =====
public interface IVisionAlgorithm : IDisposable {
    string Name { get; }
    void Initialize(string configPath);
    DetectionResult Detect(HObject image);
}

// 算法插件示例：形状匹配检测
public class ShapeMatchingAlgorithm : IVisionAlgorithm {
    private HTuple modelHandle;
    public string Name => "形状模板匹配";

    public void Initialize(string configPath) {
        var config = ConfigManager.Instance.LoadRecipe(configPath);
        HOperatorSet.ReadShapeModel(config.ModelPath, out modelHandle);
    }

    public DetectionResult Detect(HObject image) {
        // ... 匹配检测逻辑 ...
        return new DetectionResult();
    }

    public void Dispose() {
        HOperatorSet.ClearShapeModel(modelHandle);
    }
}

// 算法插件示例：Blob缺陷检测
public class BlobDefectAlgorithm : IVisionAlgorithm {
    public string Name => "Blob缺陷检测";
    public void Initialize(string configPath) { /* ... */ }
    public DetectionResult Detect(HObject image) { /* ... */ }
    public void Dispose() { /* ... */ }
}

// ===== 层3.5: 插件管理器（反射动态加载） =====
public class AlgorithmPluginManager {
    private Dictionary<string, IVisionAlgorithm> algorithms = new();

    public void LoadPlugins(string pluginDir) {
        foreach (var dll in Directory.GetFiles(pluginDir, "*.dll")) {
            var assembly = Assembly.LoadFrom(dll);
            var algoTypes = assembly.GetTypes()
                .Where(t => typeof(IVisionAlgorithm).IsAssignableFrom(t)
                    && !t.IsInterface && !t.IsAbstract);
            foreach (var type in algoTypes) {
                var algo = (IVisionAlgorithm)Activator.CreateInstance(type);
                algo.Initialize(type.Name + ".json");
                algorithms[algo.Name] = algo;
            }
        }
    }

    public IVisionAlgorithm GetAlgorithm(string name) {
        return algorithms.TryGetValue(name, out var algo) ? algo : null;
    }
}

// ===== 层4: 系统层 - 状态机+调度 =====
public class VisionOrchestrator {
    private ICamera camera;
    private IPlcCommunicator plc;
    private IVisionAlgorithm algorithm;
    private BlockingCollection<HObject> imageQueue;
    private VisionStateMachine stateMachine;

    public void Initialize(ICamera cam, IPlcCommunicator p,
        IVisionAlgorithm algo) {
        camera = cam;
        plc = p;
        algorithm = algo;
        imageQueue = new BlockingCollection<HObject>(3);
        stateMachine = new VisionStateMachine();

        // 采集 → 队列 → 检测 解耦
        camera.StartGrab(img => {
            try { imageQueue.Add(img); } catch { }
        });

        // 检测线程
        new Thread(() => {
            while (true) {
                var image = imageQueue.Take();
                var result = algorithm.Detect(image);
                image.Dispose();
                plc.Write("M200.0", result.IsOk);
                plc.Write("M100.0", false); // 复位触发
                OnDetectionComplete?.Invoke(result);
            }
        }) { IsBackground = true }.Start();
    }

    public event Action<DetectionResult> OnDetectionComplete;
}

// ===== 层5: 界面层 - WPF/MVVM =====
public class MainViewModel : ViewModelBase {
    private VisionOrchestrator orchestrator;

    // 界面只通过事件和数据绑定与系统层通信
    public MainViewModel(VisionOrchestrator orch) {
        orchestrator = orch;
        orchestrator.OnDetectionComplete += result => {
            Dispatcher.Invoke(() => {
                Stats.OkCount += result.IsOk ? 1 : 0;
                Stats.NgCount += result.IsOk ? 0 : 1;
            });
        };
    }
}`,
