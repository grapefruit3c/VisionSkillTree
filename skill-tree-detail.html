code:`// 性能优化与产线节拍分析
using System.Diagnostics;

public class PerformanceOptimizer {
    // 分段计时器
    public class CycleTimer {
        private Stopwatch sw = new();
        private Dictionary<string, double> timings = new();

        public IDisposable Measure(string section) {
            return new TimerScope(sw, section, timings);
        }

        public void Report() {
            double total = timings.Values.Sum();
            Log.Info("===== 耗时分析 =====");
            foreach (var kv in timings.OrderByDescending(x => x.Value)) {
                double pct = kv.Value / total * 100;
                Log.Info($"  {kv.Key}: {kv.Value:F1}ms ({pct:F0}%)");
            }
            Log.Info($"  总计: {total:F1}ms");
            // 找出瓶颈
            var bottleneck = timings.OrderByDescending(x => x.Value).First();
            Log.Info($"  瓶颈: {bottleneck.Key} ({bottleneck.Value:F1}ms)");
        }
    }

    private class TimerScope : IDisposable {
        private Stopwatch sw;
        private string section;
        private Dictionary<string, double> timings;
        private double startMs;

        public TimerScope(Stopwatch sw, string section,
            Dictionary<string, double> timings) {
            this.sw = sw; this.section = section; this.timings = timings;
            startMs = sw.Elapsed.TotalMilliseconds;
        }

        public void Dispose() {
            double elapsed = sw.Elapsed.TotalMilliseconds - startMs;
            timings[section] = timings.GetValueOrDefault(section) + elapsed;
        }
    }

    // ===== 优化后的检测流程 =====
    public class OptimizedDetector {
        private HTuple modelHandle;
        private HTuple cachedHomMat2D; // 缓存标定矩阵

        public void InitOptimized() {
            // 1. 预加载模板（不要在检测循环中加载）
            HOperatorSet.ReadShapeModel("Models/product.shm",
                out modelHandle);

            // 2. 缓存标定矩阵
            HOperatorSet.ReadTuple("calibration/matrix.tup",
                out cachedHomMat2D);

            // 3. 设置Halcon系统参数优化性能
            HOperatorSet.SetSystem("tsp_precomputation", "true");
            HOperatorSet.SetSystem("clip_region", "true");
            HOperatorSet.SetSystem("do_low_error", "false");
        }

        public DetectionResult DetectOptimized(HObject image,
            CycleTimer timer) {
            HObject grayImage = null, matchedROI = null,
                  detectImage = null;

            using (timer.Measure("预处理")) {
                HOperatorSet.Rgb1ToGray(image, out grayImage);
            }

            HTuple row, col, angle, score;
            using (timer.Measure("模板匹配")) {
                // ★ 优化1: 大金字塔层级 + 高greediness
                HOperatorSet.FindShapeModel(grayImage, modelHandle,
                    -0.17, 0.35,
                    0.5,   // min_score: 适当降低
                    1,     // num_matches
                    0.9,   // ★ greediness=0.9 (越高越快)
                    "least_squares_high", // ★ 高精度模式
                    0,     // 金字塔最低层
                    0.95,  // ★ 最低分数
                    out row, out col, out angle, out score);
            }

            if (score.Length == 0)
                return new DetectionResult { IsOk = false };

            using (timer.Measure("ROI裁剪")) {
                // ★ 优化2: 只处理ROI区域而非整图
                HOperatorSet.VectorAngleToRigid(0, 0, 0,
                    row.D, col.D, angle.D, out HTuple homMat);
                HOperatorSet.GenRectangle1(out matchedROI,
                    50, 50, 400, 500);
                HOperatorSet.AffineTransRegion(matchedROI,
                    out matchedROI, homMat, "false");
                HOperatorSet.ReduceDomain(grayImage, matchedROI,
                    out detectImage);
            }

            using (timer.Measure("缺陷检测")) {
                // ★ 优化3: 在裁剪后的小图上做检测
                HOperatorSet.Threshold(detectImage, out var region, 0, 80);
                HOperatorSet.Connection(region, out var connected);
                HOperatorSet.SelectShape(connected,
                    out var defects, "area", "and", 50, 99999);
                HOperatorSet.AreaCenter(defects,
                    out var area, out _, out _);

                SafeDisposeAll(grayImage, matchedROI, detectImage,
                    region, connected, defects);
                return new DetectionResult { IsOk = area.Length == 0 };
            }
        }

        private void SafeDisposeAll(params HObject[] objs) {
            foreach (var o in objs) o?.Dispose();
        }
    }

    // 产线节拍分析
    public class TaktAnalyzer {
        // 产线节拍 = 单件间隔时间
        public double LineTakt { get; set; } = 2000; // 2秒/件

        public bool IsCycleTimeAcceptable(double cycleMs) {
            // 检测耗时必须 < 节拍×0.8 (留20%余量)
            double maxAllowed = LineTakt * 0.8;
            Log.Info($"检测耗时: {cycleMs:F0}ms / 允许最大: {maxAllowed:F0}ms" +
                (cycleMs <= maxAllowed ? " [OK]" : " [超时!]"));
            return cycleMs <= maxAllowed;
        }

        public string OptimizeSuggestion(double cycleMs) {
            if (cycleMs > LineTakt) {
                return "检测耗时超过节拍！建议：1.增加检测工位并行 " +
                    "2.降低金字塔层数 3.使用GPU加速 4.减小ROI";
            }
            return cycleMs > LineTakt * 0.8
                ? "接近节拍上限，建议优化算法参数"
                : "性能充足";
        }
    }
}`,

    // 验收测试
    public class AcceptanceTest {
        private int totalTested = 0;
        private int trueOk = 0;
        private int trueNg = 0;
        private int falseOk = 0;  // 漏检
        private int falseNg = 0;  // 误检
        private List<double> cycleTimes = new();

        public void RecordTest(bool actualOk, bool expectedOk,
            double cycleMs) {
            totalTested++;
            cycleTimes.Add(cycleMs);

            if (expectedOk && actualOk) trueOk++;
            else if (expectedOk && !actualOk) falseNg++;
            else if (!expectedOk && !actualOk) trueNg++;
            else falseOk++;
        }

        public AcceptanceReport GenerateReport() {
            double detectionRate = (double)trueNg /
                (trueNg + falseOk) * 100;
            double falseAlarmRate = (double)falseNg /
                (falseNg + trueOk) * 100;
            double avgCycle = cycleTimes.Average();
            double maxCycle = cycleTimes.Max();
            double p95Cycle = cycleTimes.OrderBy(x => x)
                .Skip((int)(cycleTimes.Count * 0.95)).First();

            return new AcceptanceReport {
                TestDate = DateTime.Now,
                TotalTested = totalTested,
                DetectionRate = detectionRate,
                FalseAlarmRate = falseAlarmRate,
                AvgCycleMs = avgCycle,
                MaxCycleMs = maxCycle,
                P95CycleMs = p95Cycle,
                IsPassed = detectionRate >= 95 &&
                    falseAlarmRate <= 2 &&
                    maxCycle <= 2000 // 节拍2秒
            };
        }
    }

            HObject image;
            HOperatorSet.ReadImage(out image,
                records[currentIndex].FilePath);
            return image;
        }

        public void Next() { if (currentIndex < records.Count-1) currentIndex++; }
        public void Prev() { if (currentIndex > 0) currentIndex--; }

        public ImageArchiveService.ImageRecord CurrentRecord =>
            records.Count > 0 ? records[currentIndex] : null;
    }

    // 离线重检测
    public class OfflineReDetect {
        public class ReDetectResult {
            public string ImagePath { get; set; }
            public bool OriginalResult { get; set; }
            public bool NewResult { get; set; }
            public bool IsConsistent =>
                OriginalResult == NewResult;
        }

        // 批量重检测
        public List<ReDetectResult> BatchRedetect(
            List<string> imagePaths, DetectionConfig newConfig) {
            var results = new List<ReDetectResult>();

            // 应用新配置
            detector.UpdateConfig(newConfig);

            foreach (var path in imagePaths) {
                HObject image;
                HOperatorSet.ReadImage(out image, path);

                // 记录原始结果（从文件名或数据库）
                bool original = path.Contains("_NG_") ? false : true;

                // 用新参数重新检测
                var result = detector.Detect(image);
                image.Dispose();

                results.Add(new ReDetectResult {
                    ImagePath = path,
                    OriginalResult = original,
                    NewResult = result.IsOk
                });
            }

            // 统计一致性
            int consistent = results.Count(r => r.IsConsistent);
            double consistency = (double)consistent / results.Count * 100;
            Log.Info($"重检测一致性: {consistency:F1}% " +
                $"({consistent}/{results.Count})");

            return results;
        }
    }

// ===== ASP.NET Core Web API 后端 =====
[ApiController]
[Route("api/vision")]
public class VisionApiController : ControllerBase {
    private VisionSystem system;

    [HttpGet("status")]
    public IActionResult GetStatus() {
        return Ok(new {
            isRunning = system.IsRunning,
            currentState = system.StateMachine.CurrentState.ToString(),
            cameraConnected = system.Camera.IsConnected,
            plcConnected = system.Plc.IsConnected,
            activeAlarms = system.AlarmSystem.ActiveAlarms.Count,
            lastHeartbeat = system.LastHeartbeat
        });
    }

    [HttpGet("stats")]
    public IActionResult GetStats() {
        return Ok(new {
            okCount = system.Stats.OkCount,
            ngCount = system.Stats.NgCount,
            yield = system.Stats.Yield,
            avgCycleMs = system.Stats.AvgCycleTime,
            defectDistribution = system.Stats.DefectDistribution
        });
    }

    [HttpPost("control")]
    public IActionResult Control([FromBody] ControlCommand cmd) {
        if (cmd.Action == "start") system.Start();
        else if (cmd.Action == "stop") system.Stop();
        return Ok(new { success = true });
    }
}

// ===== SignalR 实时推送 =====
public class VisionHub : Hub {
    public async Task SendUpdate(VisionStats stats) {
        await Clients.All.SendAsync("StatsUpdate", stats);
    }

    public async Task SendAlarm(AlarmSystem.Alarm alarm) {
        await Clients.All.SendAsync("AlarmTriggered", alarm);
    }
}

// 视觉系统集成SignalR
public class VisionSystem {
    private IHubContext<VisionHub> hubContext;

    public void OnDetectionComplete(DetectionResult result) {
        // 更新统计
        if (result.IsOk) Stats.OkCount++;
        else Stats.NgCount++;

        // 推送到所有Web客户端
        hubContext.Clients.All.SendAsync("StatsUpdate", new {
            ok = Stats.OkCount,
            ng = Stats.NgCount,
            yield = Stats.Yield,
            lastResult = result.IsOk ? "OK" : "NG",
            timestamp = DateTime.Now
        });
    }
}

// ===== 移动端报警推送（企业微信机器人） =====
public class WeChatAlarmPusher {
    private string webhookUrl;

    public async Task PushAlarm(AlarmSystem.Alarm alarm) {
        if (alarm.Level != AlarmSystem.AlarmLevel.Critical) return;

        var message = new {
            msgtype = "markdown",
            markdown = new {
                content = $@"## 视觉系统报警
> **级别**: <font color=""warning"">严重</font>
> **故障码**: {alarm.Code}
> **标题**: {alarm.Title}
> **描述**: {alarm.Description}
> **修复建议**: {alarm.Solution}
> **时间**: {alarm.Timestamp:yyyy-MM-dd HH:mm:ss}
> **设备**: {Environment.MachineName}"
            }
        };

        var json = JsonConvert.SerializeObject(message);
        var content = new StringContent(json, Encoding.UTF8,
            "application/json");

        using var client = new HttpClient();
        await client.PostAsync(webhookUrl, content);
    }
}

using Microsoft.AspNetCore.Mvc;

[ApiController]
[Route("api/remote")]
public class RemoteControlController : ControllerBase {
    private VisionSystem system;
    private ConfigManager config;

    // 远程修改检测参数（热加载）
    [HttpPost("params")]
    public IActionResult UpdateParams(
        [FromBody] DetectionConfig newConfig,
        [FromHeader] string authToken) {
        // 权限验证
        if (!AuthService.ValidateToken(authToken, UserRole.Engineer))
            return Unauthorized("无权修改参数");

        // 参数范围校验
        if (newConfig.MinScore < 0 || newConfig.MinScore > 1)

        AuditLog.Log(AuthService.GetUser(authToken),

        if (!AuthService.ValidateToken(authToken, UserRole.Admin))

// 热加载实现
public class HotReloadManager {
    private FileSystemWatcher watcher;

    public void StartWatching(string configPath) {
        watcher = new FileSystemWatcher(
            Path.GetDirectoryName(configPath),
            Path.GetFileName(configPath));

        watcher.Changed += (s, e) => {
            // 文件变化时重新加载
            Thread.Sleep(500); // 等文件写入完成
            ConfigManager.Instance.Load();
            OnConfigChanged?.Invoke(ConfigManager.Instance.Config);
        };
        watcher.EnableRaisingEvents = true;
    }

    public event Action<AppConfig> OnConfigChanged;
}

public class RecipeSwitchScheduler {

        pendingRecipe = recipeName;
        switchPending = true;

    // 在每个检测周期开始前检查
    public bool CheckSwitch() {

            detector.ReloadModel(newConfig.ModelPath);

        }
        return false;
    }

code:`// OpenCVSharp 图像处理 Pipeline
using OpenCvSharp;
using OpenCvSharp.Extensions;

public class OpenCvDetector : IVisionAlgorithm {
    public DetectionResult Execute(Mat image) {
        // 1. 预处理
        Mat gray = new Mat();
        Cv2.CvtColor(image, gray, ColorConversionCodes.BGR2GRAY);
        Cv2.GaussianBlur(gray, gray, new Size(5, 5), 0);

        // 2. 边缘检测
        Mat edges = new Mat();
        Cv2.Canny(gray, edges, 50, 150);

        // 3. 轮廓提取
        Point[][] contours;
        HierarchyIndex[] hierarchy;
        Cv2.FindContours(edges, out contours, out hierarchy,
            RetrievalModes.External, ContourApproximationModes.ApproxSimple);

        // 4. 筛选目标轮廓
        foreach (var contour in contours) {
            double area = Cv2.ContourArea(contour);
            if (area < 500 || area > 50000) continue;
            var rect = Cv2.BoundingRect(contour);
            // 返回检测结果
            return new DetectionResult {
                IsFound = true,
                X = rect.X, Y = rect.Y,
                Width = rect.Width, Height = rect.Height
            };
        }
        return new DetectionResult { IsFound = false };
    }
}`,

code:`// C# 串口通信框架
using System.IO.Ports;

public class SerialDevice {
    private SerialPort _port;
    private byte[] _buffer = new byte[1024];
    private int _bufferLen = 0;

    public void Connect(string portName, int baudRate) {
        _port = new SerialPort(portName, baudRate, Parity.None, 8, StopBits.One);
        _port.DataReceived += OnDataReceived;
        _port.Open();
    }

    // 发送命令帧
    public void SendCommand(byte cmd, byte[] data) {
        byte[] frame = new byte[data.Length + 5];
        frame[0] = 0xAA;            // 帧头
        frame[1] = cmd;              // 命令码
        frame[2] = (byte)data.Length;// 数据长度
        Buffer.BlockCopy(data, 0, frame, 3, data.Length);
        ushort crc = Crc16(frame, frame.Length - 2);
        frame[frame.Length - 2] = (byte)(crc & 0xFF);
        frame[frame.Length - 1] = (byte)(crc >> 8);
        _port.Write(frame, 0, frame.Length);
    }

    private void OnDataReceived(object sender, SerialDataReceivedEventArgs e) {
        int read = _port.Read(_buffer, _bufferLen, _buffer.Length - _bufferLen);
        _bufferLen += read;
        // 查找帧头并解析
        ParseFrame();
    }

    private ushort Crc16(byte[] data, int length) {
        ushort crc = 0xFFFF;
        for (int i = 0; i < length; i++) {
            crc ^= data[i];
            for (int j = 0; j < 8; j++) {
                if ((crc & 1) != 0) crc = (ushort)((crc >> 1) ^ 0xA001);
                else crc >>= 1;
            }
        }
        return crc;
    }
}`,

code:`// 分级存储架构：本地缓存 + 远程同步
using MySql.Data.MySqlClient;
using System.Data.SQLite;

public class InspectionRepository {
    private string _mysqlConn = "Server=192.168.1.100;Database=vision;Uid=root;Pwd=123456;";
    private string _sqliteConn = "Data Source=local_cache.db";

    // 写入检测记录(优先MySQL，失败走SQLite缓存)
    public void SaveResult(InspectionResult result) {
        try {
            using (var conn = new MySqlConnection(_mysqlConn)) {
                conn.Open();
                string sql = "INSERT INTO inspection_log (barcode, result, defect_type, " +
                    "measurement, inspect_time, line_id) VALUES (@bc,@r,@dt,@m,@t,@li)";
                using (var cmd = new MySqlCommand(sql, conn)) {
                    cmd.Parameters.AddWithValue("@bc", result.Barcode);
                    cmd.Parameters.AddWithValue("@r", result.IsOk ? "OK" : "NG");
                    cmd.Parameters.AddWithValue("@dt", result.DefectType ?? "");
                    cmd.Parameters.AddWithValue("@m", result.Measurement);
                    cmd.Parameters.AddWithValue("@t", result.Timestamp);
                    cmd.Parameters.AddWithValue("@li", result.LineId);
                    cmd.ExecuteNonQuery();
                }
            }
        } catch (Exception) {
            // MySQL不可用，写入本地SQLite缓存
            SaveToCache(result);
        }
    }

    // 本地缓存
    private void SaveToCache(InspectionResult result) {
        using (var conn = new SQLiteConnection(_sqliteConn)) {
            conn.Open();
            string sql = "INSERT INTO cache_inspection (barcode, result, defect_type, " +
                "measurement, inspect_time, line_id, synced) " +
                "VALUES (@bc,@r,@dt,@m,@t,@li,0)";
            using (var cmd = new SQLiteCommand(sql, conn)) {
                cmd.Parameters.AddWithValue("@bc", result.Barcode);
                cmd.Parameters.AddWithValue("@r", result.IsOk ? "OK" : "NG");
                cmd.Parameters.AddWithValue("@dt", result.DefectType ?? "");
                cmd.Parameters.AddWithValue("@m", result.Measurement);
                cmd.Parameters.AddWithValue("@t", result.Timestamp);
                cmd.Parameters.AddWithValue("@li", result.LineId);
                cmd.ExecuteNonQuery();
            }
        }
    }

    // 网络恢复后同步缓存数据
    public void SyncCache() {
        using (var sqlite = new SQLiteConnection(_sqliteConn)) {
            sqlite.Open();
            var cmd = new SQLiteCommand("SELECT * FROM cache_inspection WHERE synced=0", sqlite);
            using (var reader = cmd.ExecuteReader()) {
                while (reader.Read()) {
                    var result = MapToResult(reader);
                    SaveResult(result); // 重新写入MySQL
                }
            }
            // 标记已同步
            new SQLiteCommand("UPDATE cache_inspection SET synced=1 WHERE synced=0", sqlite)
                .ExecuteNonQuery();
        }
    }
}`,

code:`// 插件化架构：反射动态加载算法模块
// 1. 共享接口(独立DLL，所有插件和主程序引用)
public interface IAlgorithmPlugin {
    string Name { get; }
    string Version { get; }
    void Initialize(Dictionary<string, object> config);
    DetectionResult Execute(Mat image);
}

// 2. 插件实现(独立DLL，编译到plugins目录)
public class SizeMeasurementPlugin : IAlgorithmPlugin {
    public string Name => "尺寸测量";
    public string Version => "1.0.0";
    private double _threshold;
    public void Initialize(Dictionary<string, object> config) {
        _threshold = Convert.ToDouble(config["threshold"]);
    }
    public DetectionResult Execute(Mat image) {
        // 尺寸测量逻辑
        return new DetectionResult { IsOk = true };
    }
}

// 3. 插件加载器(主程序)
public class PluginLoader {
    private Dictionary<string, IAlgorithmPlugin> _plugins = new();

    public void LoadAll(string pluginDir) {
        foreach (var dllPath in Directory.GetFiles(pluginDir, "*.dll")) {
            try {
                var assembly = Assembly.LoadFrom(dllPath);
                var pluginTypes = assembly.GetTypes()
                    .Where(t => typeof(IAlgorithmPlugin).IsAssignableFrom(t)
                        && !t.IsInterface && !t.IsAbstract);
                foreach (var type in pluginTypes) {
                    var plugin = (IAlgorithmPlugin)Activator.CreateInstance(type);
                    plugin.Initialize(LoadConfig(type.Name));
                    _plugins[plugin.Name] = plugin;
                    Console.WriteLine($"已加载插件: {plugin.Name} v{plugin.Version}");
                }
            } catch (Exception ex) {
                Console.WriteLine($"加载插件失败 {dllPath}: {ex.Message}");
            }
        }
    }

    public IAlgorithmPlugin GetPlugin(string name) {
        return _plugins.TryGetValue(name, out var plugin) ? plugin : null;
    }
}

// 4. 使用：运行时切换算法
var loader = new PluginLoader();
loader.LoadAll("./plugins");
// 切换到尺寸测量算法
var algo = loader.GetPlugin("尺寸测量");
var result = algo.Execute(image);
// 运行时热切换到缺陷检测，不需要重启
algo = loader.GetPlugin("缺陷检测");
result = algo.Execute(image);`,

code:`// 三大设计模式在视觉软件中的组合应用
// 1. 策略模式：不同检测策略
public interface IDetectStrategy {
    DetectionResult Detect(Mat image);
}
public class SizeStrategy : IDetectStrategy {
    public DetectionResult Detect(Mat image) {
        // 尺寸检测逻辑
        return new DetectionResult { IsOk = true, Type = "Size" };
    }
}
public class DefectStrategy : IDetectStrategy {
    public DetectionResult Detect(Mat image) {
        // 缺陷检测逻辑
        return new DetectionResult { IsOk = true, Type = "Defect" };
    }
}

// 2. 工厂模式：按需创建策略
public static class DetectFactory {
    public static IDetectStrategy Create(string productType) {
        return productType switch {
            "bearing" => new SizeStrategy(),
            "surface" => new DefectStrategy(),
            _ => throw new ArgumentException("未知产品类型: " + productType)
        };
    }
}

// 3. 观察者模式：检测结果通知
public class InspectionPublisher {
    public event Action<DetectionResult> OnInspected;
    public void Inspect(Mat image, string productType) {
        var strategy = DetectFactory.Create(productType);
        var result = strategy.Detect(image);
        OnInspected?.Invoke(result); // 通知所有订阅者
    }
}

// 4. 使用：工厂创建策略，策略执行检测，观察者分发结果

// 1. 统一设备接口
public interface IDevice {
    string DeviceType { get; }
    string DeviceId { get; }
    bool IsConnected { get; }
    bool Open();
    void Close();
    string GetInfo();
}

// 相机接口继承IDevice
public interface ICamera : IDevice {
    Mat Grab();
    bool SetTrigger(TriggerMode mode);
}

// 2. 设备配置(JSON)
// config.json:
// {"devices": [
//   {"id":"cam1","type":"camera","brand":"hik","dll":"HikDriver.dll","sn":"DA123456789"},
//   {"id":"cam2","type":"camera","brand":"dahua","dll":"DaHuaDriver.dll","sn":"DH987654321"},
//   {"id":"plc1","type":"plc","brand":"siemens","dll":"SiemensDriver.dll","ip":"192.168.1.200"}
// ]}

// 3. 设备管理器：反射加载+多态调用
public class DeviceManager : IDisposable {
    private Dictionary<string, IDevice> _devices = new();
    private Dictionary<string, IDevice> _backups = new();

    // 从配置加载所有设备
    public void LoadFromConfig(string configPath) {
        var config = JsonSerializer.Deserialize<DeviceConfig>(File.ReadAllText(configPath));
        foreach (var dev in config.Devices) {
            // 反射加载驱动DLL
            var assembly = Assembly.LoadFrom(dev.Dll);
            var driverType = assembly.GetTypes()
                .First(t => typeof(IDevice).IsAssignableFrom(t) && !t.IsAbstract);
            var instance = (IDevice)Activator.CreateInstance(driverType);
            instance.Open();
            _devices[dev.Id] = instance;
        }
    }

    // 泛型获取设备(多态)
    public T GetDevice<T>(string id) where T : class, IDevice {
        return _devices.TryGetValue(id, out var dev) ? dev as T : null;
    }

    // 热替换设备(不重启)
    public void ReplaceDevice(string id, string newDllPath) {
        if (_devices.TryGetValue(id, out var old)) {
            old.Close();
            _devices.Remove(id);
        }
        var assembly = Assembly.LoadFrom(newDllPath);
        var driverType = assembly.GetTypes()
            .First(t => typeof(IDevice).IsAssignableFrom(t) && !t.IsAbstract);
        var instance = (IDevice)Activator.CreateInstance(driverType);
        instance.Open();
        _devices[id] = instance;
    }

    // 故障转移
    public void OnDeviceLost(string id) {
        if (_backups.TryGetValue(id, out var backup)) {
            _devices[id] = backup;
            backup.Open();
            // 触发报警事件
            OnDeviceFailedOver?.Invoke(id, backup.GetInfo());
        }
    }

    public event Action<string, string> OnDeviceFailedOver;

    public void Dispose() {
        foreach (var dev in _devices.Values) dev.Close();
        foreach (var dev in _backups.Values) dev.Close();
    }
}`,

pitfalls:[
"<b>接口设计过度：</b>IDevice接口过于宽泛(包含Open/Close)可能导致某些设备没有对应的实现(如光源控制器没有GetInfo)。接口要按设备类型分层",
"<b>故障检测滞后：</b>如果设备IsConnected只是读缓存标志位，实际断线可能要几秒才检测到。需要心跳机制(定时Ping)而不是被动检测"
],
scenario:"产线有2台海康相机(主+备)和1台大华相机。通过DeviceManager管理，配置文件指定主相机和备用相机。主相机断线(USB线松动)时，DeviceManager在500ms内检测到心跳超时，自动切换到备用相机，产线不停机。同时触发报警通知维修人员。维修完成后热替换回主相机(ReplaceDevice)，不需要重启软件。整个过程对上层检测逻辑完全透明。"
}}

// ===== 渲染逻辑 =====
var cats=Object.keys(CAT_COLORS);
var legendEl=document.getElementById("legend");
cats.forEach(function(c){var d=document.createElement("div");d.className="legend-item";d.innerHTML='<span class="legend-dot" style="background:'+CAT_COLORS[c]+'"></span>'+c;legendEl.appendChild(d);});

function iconSvg(name,color){var p=ICON_PATH[name]||ICON_PATH.code;return '<svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>';}
function stars(n){var s="";for(var i=0;i<5;i++){s+=i<n?"\u2605":"\u2606";}return s;}

var treeEl=document.getElementById("tree");
for(var lv=1;lv<=6;lv++){
  var col=document.createElement("div");col.className="level-col";
  var head=document.createElement("div");head.className="level-head";head.textContent=LEVEL_NAMES[lv];col.appendChild(head);
  var nodes=DATA.filter(function(n){return n.dl===lv;}).sort(function(a,b){return a.oi-b.oi;});
  nodes.forEach(function(nd){
    var card=document.createElement("div");card.className="node";card.dataset.key=nd.k;
    var color=CAT_COLORS[nd.cat]||"#3B82F6";card.style.setProperty("--cat-color",color);
    var depNames=nd.deps.map(function(dk){var dn=DATA.filter(function(x){return x.k===dk;})[0];return dn?dn.t:"";}).filter(Boolean);
    var depsHtml=depNames.length?'<div class="deps">\u524d\u7f6e: <span>'+depNames.join("\u3001")+'</span></div>':"";
    card.innerHTML='<div class="node-check" onclick="event.stopPropagation();toggleCheck(this.parentElement)">\u2713</div><div class="node-detail-btn" onclick="event.stopPropagation();openDetail(\''+nd.k+'\')">\u8be6\u60c5</div><div class="node-head">'+iconSvg(nd.ic,color)+'<span class="node-title">'+nd.t+'</span></div><div class="node-meta"><span class="badge badge-diff">'+stars(nd.df)+'</span><span class="badge badge-depth">'+DEPTH_NAMES[nd.rd]+'</span><span class="badge badge-time">'+nd.em+'min</span></div>'+depsHtml;
    col.appendChild(card);
  });
  treeEl.appendChild(col);
}

// 勾选完成
function toggleCheck(card){card.classList.toggle("completed");saveProgress();updateStats();}

// 进度存储
var STORAGE_KEY="mv_skill_tree_progress_v2";
function saveProgress(){var done=[];document.querySelectorAll(".node.completed").forEach(function(n){done.push(n.dataset.key);});localStorage.setItem(STORAGE_KEY,JSON.stringify(done));}
function loadProgress(){try{var done=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");done.forEach(function(k){var el=document.querySelector('.node[data-key="'+k+'"]');if(el)el.classList.add("completed");});}catch(e){}}
function updateStats(){var total=DATA.length;var done=document.querySelectorAll(".node.completed").length;var pct=Math.round(done/total*100);document.getElementById("doneCount").textContent=done;document.getElementById("percentCount").textContent=pct+"%";document.getElementById("progressFill").style.width=pct+"%";}
loadProgress();updateStats();

// 代码高亮
function highlightCode(code,lang){
  var wrap=function(s,cls){return '<span class="'+cls+'">'+s+'</span>';};
  if(lang==="hdevelop"){
    code=code.replace(/^(\*.*)$/gm,function(m){return wrap(m,"tk-com");});
    code=code.replace(/\b(read_image|threshold|connection|select_shape|area_center|create_shape_model|find_shape_model|reduce_domain|opening_circle|closing_circle|rgb1_to_gray|mean_image|dyn_threshold|auto_threshold|create_bar_code_model|find_bar_code|create_data_code_2d_model|find_data_code_2d|gray_histo|gen_rectangle1|draw_rectangle1|vector_angle_to_rigid|affine_trans_region|count_obj|write_shape_model|set_bar_code_param|set_data_code_2d_param|create_ocr_class_mlp|trainf_ocr_class_mlp|do_ocr_multi_class_mlp|sort_region|emphasize|scale_image|median_image|gauss_filter|bilateralfilter|fft_image|ifft_image|gen_bandpass|convolve_fft|smooth_region|find_caltab|find_marks_and_pose|radial_distortion|gen_radial_distortion_map|map_image|edges_sub_pix|fit_line|fit_circle|distance_pp|opening_region|closing_region|boundary|complement|intersection|union1|gen_empty_region|fill_up|shape_trans|skeleton|pruning|distance_transform|watersheds|texture_laws|cooc_feature_matrix|gen_gabor_filter|convolve_gabor|binomial_filter|min_max_gray|scale_image_max|invert_image|trans_from_rgb|decompose3|trans_to_rgb|crop_part|zoom_image_size|rotate_image|mirror_image|affine_trans_image|set_system|get_system|count_seconds|wait_seconds|disp_obj|set_display_font|set_color|set_draw|set_line_width|dev_display|dev_open_window|dev_close_window|dev_set_window|get_image_size|get_image_type|gen_image1|gen_image3|gen_image_const|convert_image_type|crop_domain|add_noise_white|add_noise_distribution|tile_images|tile_channels|channels_to_image|image_to_channels)\b/g,function(m){return wrap(m,"tk-fn");});
    return code;
  }
  if(lang==="csharp"){
    code=code.replace(/(\/\/.*)/g,function(m){return wrap(m,"tk-com");});
    code=code.replace(/(\/\*[\s\S]*?\*\/)/g,function(m){return wrap(m,"tk-com");});
    code=code.replace(/\b(public|private|protected|internal|static|readonly|const|new|return|if|else|while|for|foreach|switch|case|break|continue|try|catch|finally|throw|using|namespace|class|struct|enum|interface|void|var|bool|int|double|string|float|byte|long|short|char|object|this|base|null|true|false|async|await|Task|Thread|override|virtual|abstract|sealed|get|set|in|out|ref|params)\b/g,function(m){return wrap(m,"tk-key");});
    code=code.replace(/(&quot;.*?&quot;)/g,function(m){return wrap(m,"tk-str");});
    return code;
  }
  if(lang==="xml"){
    code=code.replace(/(&lt;!--.*?--&gt;)/g,function(m){return wrap(m,"tk-com");});
    code=code.replace(/(&lt;\/?[\w-]+)/g,function(m){return wrap(m,"tk-key");});
    code=code.replace(/(&quot;.*?&quot;)/g,function(m){return wrap(m,"tk-str");});
    return code;
  }
  if(lang==="bash"){
    code=code.replace(/(^#.*)/gm,function(m){return wrap(m,"tk-com");});
    code=code.replace(/\b(git|add|commit|push|pull|checkout|branch|merge|rebase|stash|log|status|config|init|clone|remote|tag|diff)\b/g,function(m){return wrap(m,"tk-fn");});
    return code;
  }
  return code;
}

// 详情面板
function openDetail(key){
  var nd=DATA.filter(function(n){return n.k===key;})[0];
  if(!nd||!nd.detail)return;
  var d=nd.detail;
  var color=CAT_COLORS[nd.cat]||"#3B82F6";

  // 资源列表
  var resHtml=d.resources.map(function(r){
    return '<a class="resource-item" href="'+r.u+'" target="_blank"><span class="resource-type '+r.t+'">'+r.t+'</span><span class="resource-name">'+r.n+'</span><span class="resource-url">'+r.u.replace(/https?:\/\//g,'')+'</span></a>';
  }).join("");

  // 步骤列表
  var stepHtml=d.steps.map(function(s){return '<div class="step-item"><div class="step-num"></div><div class="step-text">'+s+'</div></div>';}).join("");

  // 代码块
  var codeHtml='<div class="code-block"><div class="code-header"><span class="code-lang">'+(d.codeLang||"text").toUpperCase()+'</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre class="code-content" id="codeContent">'+highlightCode(escapeHtml(d.code),d.codeLang)+'</pre></div>';

  // 陷阱列表
  var pitHtml=d.pitfalls.map(function(p){return '<div class="pitfall-item"><span class="pitfall-icon">\u26a0</span><span class="pitfall-text">'+p+'</span></div>';}).join("");

  // 学习目标
  var loHtml=nd.lo.map(function(x){return '<li>'+x+'</li>';}).join("");
  var kcHtml=nd.kc.map(function(x){return '<li>'+x+'</li>';}).join("");
  var oeHtml=nd.oe.map(function(x){return '<li>'+x+'</li>';}).join("");

  // 导航
  var idx=DATA.findIndex(function(n){return n.k===key;});
  var prevBtn=idx>0?'<button onclick="openDetail(\''+DATA[idx-1].k+'\')">\u2190 '+DATA[idx-1].t.substring(0,12)+'</button>':'<button disabled>\u5df2\u662f\u7b2c\u4e00\u4e2a</button>';
  var nextBtn=idx<DATA.length-1?'<button onclick="openDetail(\''+DATA[idx+1].k+'\')">'+DATA[idx+1].t.substring(0,12)+' \u2192</button>':'<button disabled>\u5df2\u662f\u6700\u540e\u4e00\u4e2a</button>';

  var html='<div class="dp-header">'+
    '<span class="dp-cat-tag" style="background:'+color+'">'+nd.cat+'</span>'+
    '<div class="dp-title">'+nd.t+'</div>'+
    '<div class="dp-desc">'+nd.d+'</div>'+
    '<div class="dp-meta"><span class="badge badge-diff">'+stars(nd.df)+'</span><span class="badge badge-depth">'+DEPTH_NAMES[nd.rd]+'</span><span class="badge badge-time">'+nd.em+'min</span></div>'+
    '<button class="dp-close" onclick="closeDetail()">\u00d7</button></div>'+
    '<div class="dp-body">'+
    '<div class="dp-section"><h3><span class="icon">\ud83d\udcda</span> \u5b66\u4e60\u8d44\u6e90</h3><div class="resource-list">'+resHtml+'</div></div>'+
    '<div class="dp-section"><h3><span class="icon">\ud83d\udca1</span> \u5b9e\u8df5\u6b65\u9aa4</h3><div class="step-list">'+stepHtml+'</div></div>'+
    '<div class="dp-section"><h3><span class="icon">\ud83d\udcbb</span> \u4ee3\u7801\u793a\u4f8b</h3>'+codeHtml+'</div>'+
    '<div class="dp-section"><h3><span class="icon">\u26a0</span> \u5e38\u89c1\u9677\u9631</h3><div class="pitfall-list">'+pitHtml+'</div></div>'+
    '<div class="dp-section"><h3><span class="icon">\ud83c\udfaf</span> \u5b9e\u6218\u573a\u666f</h3><div class="scenario-box"><p>'+d.scenario+'</p></div></div>'+
    '<div class="dp-section"><h3><span class="icon">\u2705</span> \u5b66\u4e60\u76ee\u6807\u4e0e\u9a8c\u6536</h3>'+
    '<div class="dp-sub-section"><h4>\u5b66\u4e60\u76ee\u6807</h4><ul class="lo-list">'+loHtml+'</ul></div>'+
    '<div class="dp-sub-section"><h4>\u6838\u5fc3\u6982\u5ff5</h4><ul class="kc-list">'+kcHtml+'</ul></div>'+
    '<div class="dp-sub-section"><h4>\u9a8c\u6536\u8bc1\u636e</h4><ul class="oe-list">'+oeHtml+'</ul></div>'+
    '<div class="dp-sub-section"><h4>\u6df1\u5ea6\u7406\u7531</h4><div class="scenario-box"><p style="font-size:0.78rem">'+nd.dr+'</p></div></div>'+
    '</div></div>'+
    '<div class="dp-nav">'+prevBtn+nextBtn+'</div>';

  var panel=document.getElementById("detailPanel");
  var overlay=document.getElementById("panelOverlay");
  panel.innerHTML=html;
  panel.classList.add("show");
  overlay.classList.add("show");
  panel.scrollTop=0;
}

function closeDetail(){
  document.getElementById("detailPanel").classList.remove("show");
  document.getElementById("panelOverlay").classList.remove("show");
}

document.getElementById("panelOverlay").addEventListener("click",closeDetail);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});

function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyCode(btn){
  var code=btn.parentElement.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(function(){btn.textContent="已复制";setTimeout(function(){btn.textContent="复制";},1500);});
}

// 卡片点击也打开详情
document.querySelectorAll(".node").forEach(function(n){
  n.addEventListener("click",function(e){
    if(e.target.classList.contains("node-check")||e.target.classList.contains("node-detail-btn"))return;
    openDetail(n.dataset.key);
  });
});
</script>
